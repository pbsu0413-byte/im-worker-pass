<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  .onchain-badge {
    display: inline-block;
    background: #e6ffed;
    color: #1a7f37;
    border: 1px solid #2da44e;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .onchain-fail-badge {
    display: inline-block;
    background: #ffebe9;
    color: #cf222e;
    border: 1px solid #ff8182;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .proof-box {
    margin-top: 10px;
    padding: 10px;
    background: rgba(0,0,0,0.03);
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-all;
  }
  .agency-card {
    margin-top: 12px;
    padding: 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
  }
  .agency-title {
    font-weight: bold;
    color: #1e293b;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── 병원 접수 패널: 4블록 고정 ──
     주의: ui.css의 button 기본값이 width:100% / min-height:54px 이다.
     이 패널의 작은 버튼(.rx-mini)은 반드시 그 값을 되돌려야 값 칸이 눌리지 않는다. */
  .rx-panel { margin-top: var(--space-3); border: 1px solid var(--im-line);
              border-radius: var(--radius-card); overflow: hidden; background: var(--im-surface); }
  .rx-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2);
             padding: 11px var(--space-4); background: var(--im-navy); color: #fff;
             font-size: var(--font-caption); font-weight: 600; }
  .rx-block { border-top: 1px solid var(--im-line); padding: var(--space-4); }
  .rx-block:first-of-type { border-top: none; }
  .rx-btitle { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2);
               font-weight: 700; font-size: var(--font-caption); color: var(--im-black);
               margin-bottom: var(--space-3); }
  /* 환자 진술 = 기관 증명이 아님 → 배경색으로 시각 분리 */
  .rx-selfdecl { background: var(--im-orange-light); border-left: 4px solid var(--im-orange); }
  .rx-insurance { background: var(--im-surface-soft); }

  /* 라벨 | 값 | 동작 — 값이 줄어들지 않게 min-width:0 과 자연스러운 줄바꿈을 준다 */
  .rx-row { display: flex; align-items: baseline; gap: var(--space-3);
            padding: 6px 0; font-size: 14px; }
  .rx-label { flex: 0 0 126px; color: var(--im-subtext); font-size: var(--font-caption); }
  .rx-val { flex: 1 1 auto; min-width: 0; font-weight: 600; color: var(--im-black);
            word-break: keep-all; overflow-wrap: anywhere; line-height: 1.5; }
  .rx-act { flex: 0 0 auto; display: inline-flex; gap: 6px; }
  .rx-note { font-size: var(--font-micro); color: var(--im-subtext); margin-top: var(--space-2); line-height: 1.6; }
  .rx-warn { font-size: var(--font-micro); color: #B45309; margin-top: 6px; }
  .rx-mini {
    width: auto; margin: 0; min-height: 0;
    border: 1px solid var(--im-line); background: var(--im-surface);
    border-radius: 8px; font-size: var(--font-micro); font-weight: 600;
    padding: 5px 10px; cursor: pointer; color: var(--im-text);
  }
  .rx-mini:hover { background: var(--im-surface-soft); border-color: var(--im-disabled); }
  .rx-foot { padding: 12px var(--space-4); background: var(--im-surface-soft);
             border-top: 1px solid var(--im-line);
             font-size: var(--font-micro); color: var(--im-subtext); line-height: 1.6; }
  .rx-ok { color: var(--im-mint-dark); font-weight: 700; }
  .rx-bad { color: var(--im-red); font-weight: 700; }
  .rx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--space-6); }
  @media (max-width: 520px) { .rx-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body class="role-kiosk">
  <div class="ks-top-bar">
    <span class="ph-brand"><svg class='mark' viewBox='0 0 26 23' fill='none' xmlns='http://www.w3.org/2000/svg' aria-hidden='true'><path d='M3 19.5V8.2c0-1.9 2.4-2.8 3.6-1.3L13 14.8l6.4-7.9C20.6 5.4 23 6.3 23 8.2v11.3' stroke='#00C7A9' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg><span class="nm">iM PASS</span><span class="role">사업자</span></span>
    <span class="acts">
        <div id="langSelectorArea"></div>
      <svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><path d='M18 8.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5Z'/><path d='M10.3 19a2 2 0 0 0 3.4 0'/></svg><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='3.2'/><path d='M4.8 15.4a1.7 1.7 0 0 0-.4 1.9l.6 1a1.7 1.7 0 0 0 1.7.8l1.3-.2 1.6.9.5 1.2a1.7 1.7 0 0 0 1.6 1h1.2a1.7 1.7 0 0 0 1.6-1l.5-1.2 1.6-.9 1.3.2a1.7 1.7 0 0 0 1.7-.8l.6-1a1.7 1.7 0 0 0-.4-1.9l-.9-1v-1.8l.9-1a1.7 1.7 0 0 0 .4-1.9l-.6-1a1.7 1.7 0 0 0-1.7-.8l-1.3.2-1.6-.9-.5-1.2a1.7 1.7 0 0 0-1.6-1h-1.2a1.7 1.7 0 0 0-1.6 1l-.5 1.2-1.6.9-1.3-.2a1.7 1.7 0 0 0-1.7.8l-.6 1a1.7 1.7 0 0 0 .4 1.9l.9 1v1.8l-.9 1Z'/></svg>
      <a href="home.html" class="btn-switch-service"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true' style='width:13px;height:13px;stroke-width:2.4;'><path d='M4 8.5h13M13.5 5 17 8.5 13.5 12'/><path d='M20 15.5H7M10.5 12 7 15.5 10.5 19'/></svg>서비스 전환</a>
    </span>
  </div>

  <div class="ks-head">
    <h1 id="ksTitle">근로자 자격 확인</h1>
    <span class="site" id="ksSub">제출된 QR을 읽어 근무 가능 여부를 바로 확인해요</span>
  </div>
  <div class="orgbar">
    <a href="scan.html" id="navWork">자격 확인</a>
    <a href="attendance.html">근태 등록</a>
    <a href="scan.html?mode=hospital" id="navHosp">병원 진료</a>
  </div>
  <div class="ks-wrap">


  <div class="card" id="verifierCard">
    <label id="verifierLabel">확인하는 곳</label>
    <select id="verifierId" onchange="onVerifierChange()">
      <option value="company_A" data-mode="work">A제조공장 · 이직 서류 확인과 급여계좌 등록</option>
      <option value="company_B" data-mode="work">B제조공장 · 다른 곳으로 제출된 QR 확인</option>
      <option value="hospital_1" data-mode="hospital">거점 병원 · 신원 확인과 진료 접수</option>
    </select>
  </div>

  <div class="card">
    <h3>QR 스캔</h3>
    <div id="reader" style="width:100%"></div>
    <div class="btn-row">
      <button onclick="startScan()">QR 스캔 시작</button>
      <button class="secondary" onclick="stopScan()" style="flex:0 0 120px;">중지</button>
    </div>
  </div>

  <div class="card">
    <h3>QR을 읽기 어려울 때</h3>
    <textarea id="pastedPayload" data-no-translate rows="5" placeholder='제출 화면에 표시된 코드를 붙여넣어 주세요'></textarea>
    <button onclick="verifyPasted()">자격 확인하기</button>
  </div>

  <div id="resultBox"></div>

  <script src="config.js?v=3"></script>
  <script>
    let html5QrCode;
    let _regNoFull = "", _regNoShown = false, _regNoTimer = null;

    function esc(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g,
        c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }
    function val(v, fallback) { return (v === undefined || v === null || v === "") ? (fallback || "—") : v; }

    function rxCopy(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.textContent; btn.textContent = "복사됨";
        setTimeout(() => { btn.textContent = old; }, 1200);
      }).catch(() => alert("복사에 실패했습니다: " + text));
    }

    // 등록번호는 기본 마스킹. [보기]로 20초만 노출 후 자동 재마스킹.
    function rxMask(no) {
      if (!no || no === "—") return "—";
      return no.length <= 8 ? no : no.slice(0, 8) + "●".repeat(no.length - 8);
    }
    function rxToggleReg(btn) {
      const el = document.getElementById("rxRegNo");
      if (!el || !_regNoFull || _regNoFull === "—") return;
      _regNoShown = !_regNoShown;
      el.textContent = _regNoShown ? _regNoFull : rxMask(_regNoFull);
      btn.textContent = _regNoShown ? "가리기" : "보기";
      clearTimeout(_regNoTimer);
      if (_regNoShown) {
        _regNoTimer = setTimeout(() => {
          _regNoShown = false;
          el.textContent = rxMask(_regNoFull);
          btn.textContent = "보기";
        }, 20000);
      }
    }

    function rxCopyAll(btn) {
      // 병원 전산에 그대로 붙여넣도록 탭 구분 한 줄
      navigator.clipboard.writeText(window._rxBasicTsv || "").then(() => {
        const old = btn.textContent; btn.textContent = "전체 복사됨";
        setTimeout(() => { btn.textContent = old; }, 1400);
      }).catch(() => alert("복사에 실패했습니다."));
    }

    function rxRow(label, value, copyable) {
      const v = esc(val(value));
      const btn = copyable && v !== "—"
        ? `<span class="rx-act"><button class="rx-mini" onclick="rxCopy('${v.replace(/'/g, "\\'")}', this)">복사</button></span>` : "";
      return `<div class="rx-row"><span class="rx-label">${esc(label)}</span><span class="rx-val" data-no-translate>${v}</span>${btn}</div>`;
    }

    // ── 화면 모드 ────────────────────────────────────────────────
    // 병원은 근무 자격을 보는 자리가 아니다. 환자 신분과 보험 가입 여부를 확인하는
    // 전혀 다른 업무이므로 메뉴를 따로 둔다. 검증 엔진은 같은 것을 쓴다(AGENTS.md 규칙 14).
    const SCAN_MODE =
      new URLSearchParams(location.search).get("mode") === "hospital" ? "hospital" : "work";

    (function applyMode() {
      const isHosp = SCAN_MODE === "hospital";

      document.getElementById("navWork").classList.toggle("on", !isHosp);
      document.getElementById("navHosp").classList.toggle("on", isHosp);

      document.getElementById("ksTitle").textContent =
        isHosp ? "병원 진료 접수" : "근로자 자격 확인";
      document.getElementById("ksSub").textContent =
        isHosp ? "환자 신분과 보험 가입 여부를 확인해요"
               : "제출된 QR을 읽어 근무 가능 여부를 바로 확인해요";
      document.getElementById("verifierLabel").textContent =
        isHosp ? "접수하는 곳" : "확인하는 곳";

      // 모드에 맞지 않는 선택지는 목록에서 뺀다 — 잘못 고를 여지를 없앤다.
      const sel = document.getElementById("verifierId");
      [...sel.options].forEach(o => {
        if (o.dataset.mode !== SCAN_MODE) o.remove();
      });
      if (sel.options.length === 1) {
        document.getElementById("verifierCard").style.display = "none";
      }
      if (sel.options.length) sel.selectedIndex = 0;

      if (isHosp) {
        const btn = document.querySelector('button[onclick="verifyPasted()"]');
        if (btn) btn.textContent = "환자 확인하기";
        const ta = document.getElementById("pastedPayload");
        if (ta) ta.placeholder = "환자 휴대폰에 표시된 코드를 붙여넣어 주세요";
      }
    })();

    function onVerifierChange() {
      document.getElementById("resultBox").innerHTML = "";
    }

    function startScan() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 220 },
        (decodedText) => {
          stopScan();
          try {
            const payload = JSON.parse(decodedText);
            runVerify(payload);
          } catch (e) {
            showResult({ result: "fail", message: "QR 내용을 JSON으로 해석할 수 없습니다." });
          }
        },
        () => {}
      );
    }

    function stopScan() {
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
      }
    }

    function verifyPasted() {
      try {
        const val = document.getElementById("pastedPayload").value.trim();
        if (!val) {
          showResult({ result: "fail", message: "제출 화면에 표시된 코드를 먼저 붙여넣어 주세요." });
          return;
        }
        const payload = JSON.parse(val);
        runVerify(payload);
      } catch (e) {
        showResult({ result: "fail", message: "붙여넣은 내용을 읽을 수 없어요. 제출 화면의 복사 버튼으로 다시 복사해 주세요." });
      }
    }

    async function runVerify(payload) {
      const verifierId = document.getElementById("verifierId").value;
      const box = document.getElementById("resultBox");
      // 눌렀는데 아무 반응이 없으면 고장으로 보인다. 진행 중임을 먼저 보여준다.
      if (box) box.innerHTML = `<div class="card tx-caption">자격을 확인하고 있어요…</div>`;

      let res;
      try {
        res = await fetch(`${API_BASE_URL}/presentations/secure/consume`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ payload, verifier_id: verifierId }),
        });
      } catch (e) {
        // 네트워크 자체가 실패한 경우. 여기서 잡지 않으면 화면에 아무것도 남지 않는다.
        showResult({
          result: "fail",
          reason: "NETWORK_ERROR",
          message: "확인 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.",
        }, verifierId);
        return;
      }

      let data = {};
      try { data = await res.json(); } catch (e) { data = {}; }

      if (!res.ok) {
        showResult({
          result: "fail",
          reason: data.detail || `HTTP_${res.status}`,
          message: data.detail || "자격을 확인하지 못했어요.",
        }, verifierId);
        return;
      }
      showResult(data, verifierId);
    }


    // ─────────────────────────────────────────────────────────────
    // 병원 접수 결과 패널 — 4블록 고정 (How_to_Create.md §7.9)
    //   ① 환자 기본정보  (출입국 증명 · 접수 전산에 옮겨 칠 항목)
    //   ② 환자 진술      (기관 증명 아님 · 배경색 분리)
    //   ③ 보험 확인      (손보사 자동조회 · 지급보증 아님)
    //   ④ 검증 상태      (기본 접힘 · 실패 시 자동 펼침)
    // 순서와 블록명을 바꾸지 말 것. 진료과 배정·진단명은 절대 표시하지 않는다.
    // ─────────────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────────────
    // 병원 접수 결과 패널 — 4블록 고정 (How_to_Create.md §7.9)
    //   ① 환자 기본정보  (출입국 증명 · 접수 전산에 옮겨 칠 항목)
    //   ② 환자 진술      (기관 증명 아님 · 배경색 분리)
    //   ③ 보험 확인      (손보사 자동조회 · 지급보증 아님)
    //   ④ 검증 상태      (통과 시 접힘 · 실패 시 자동 펼침)
    // 순서와 블록명을 바꾸지 말 것. 진료과 배정·진단명은 절대 표시하지 않는다.
    // 검증 실패에도 같은 패널 모양을 유지한다 — 통과 화면과 나란히 비교되어야
    // "무엇이 바뀌어서 막혔는지"가 한눈에 보이기 때문이다(철회 시연).
    // ─────────────────────────────────────────────────────────────
    function renderHospitalPanel(data, isPass) {
      const p = data.onchain_proof || {};
      const chainName = String(p.status_name || "").toUpperCase();
      const okChain = chainName === "VALID";
      const reason = data.reason || data.detail || "";

      // 검증 실패 시에는 환자 정보를 표시하지 않는다.
      // 통과 화면과 같은 모양을 유지할 이유가 없고, 실패한 증명서의 개인정보를
      // 접수 화면에 띄우면 담당자가 그대로 입력할 위험이 있다.
      if (!isPass) {
        const REASON_MSG = {
          REVOKED: "발급기관이 이 증명서를 철회했습니다.",
          HTTP_403: "이 기관으로 제출된 QR이 아닙니다.",
          HTTP_409: "이미 사용된 QR입니다.",
          HTTP_410: "QR이 만료되었습니다."
        };
        const reason = data.reason || data.detail || "VERIFY_FAILED";
        return `
        <div class="rx-panel">
          <div class="rx-head">
            <span>대구 ○○의원 · iM 제휴병원 ✓ · HOSP-001</span>
            <span>${new Date().toLocaleTimeString('ko-KR')}</span>
          </div>
          <div class="rx-block" style="background:#fef2f2;border-left:4px solid #dc2626;">
            <div class="rx-btitle">
              <span class="rx-bad">접수 진행 불가</span><span class="rx-bad">${esc(reason)}</span>
            </div>
            <div class="rx-row"><span class="rx-val">${esc(REASON_MSG[reason] || "증명서 검증에 실패했습니다.")}</span></div>
            <div class="rx-note">검증에 실패하여 환자 정보를 표시하지 않습니다. 환자에게 QR을 다시 생성하도록 안내하십시오.</div>
          </div>
          <div class="rx-block">
            <details open>
              <summary class="rx-btitle" style="cursor:pointer;">
                <span>검증 상태</span><span class="rx-bad">실패 ✗</span>
              </summary>
              <div style="margin-top:8px;" class="rx-grid">
                ${rxRow("온체인 상태", val(chainName, "조회 안 됨"), false)}
                ${rxRow("실패 사유", reason, false)}
                ${rxRow("검증 네트워크", p.mode === "live_testnet" ? "Polygon Amoy Testnet" : "EVM On-Chain Simulator", false)}
                ${rxRow("수령처 대조", "HOSP-001", false)}
              </div>
            </details>
          </div>
          <div class="rx-foot">
            접수 보조용 화면입니다. 병원 전산 입력·진료과 배정·진단은 담당자와 의료진의 판단입니다.
          </div>
        </div>`;
      }



      const name    = val(data.worker_name);
      const regNo   = val(data.reg_no || data.registration_no);
      const birth   = val(data.birth_date);
      const gender  = val(data.gender);
      const nat     = val(data.nationality);
      const visa    = val(data.visa_type, "E-9");
      const visaEnd = val(data.visa_valid_until);

      _regNoFull = regNo; _regNoShown = false; clearTimeout(_regNoTimer);
      window._rxBasicTsv = [name, regNo, birth, gender, nat].join("\t");

      const regBtns = (regNo === "—" || !isPass) ? "" :
        '<span class="rx-act">' +
        '<button class="rx-mini" onclick="rxToggleReg(this)">보기</button>' +
        '<button class="rx-mini" onclick="rxCopy(\'' + esc(regNo) + '\', this)">복사</button>' +
        '</span>';

      const banner = isPass ? "" : `
          <div class="rx-block" style="background:#fef2f2;border-left:4px solid #dc2626;">
            <div class="rx-btitle">
              <span class="rx-bad">접수 진행 불가</span>
              <span class="rx-bad">${esc(reason || "VERIFY_FAILED")}</span>
            </div>
            <div class="rx-row"><span class="rx-val">${esc(REASON_MSG[reason] || "증명서 검증에 실패했습니다.")}</span></div>
            <div class="rx-note">아래 정보를 접수에 사용하지 마십시오. 환자에게 QR을 다시 생성하도록 안내하십시오.</div>
          </div>`;

      // ② 환자 진술
      const sym = data.symptom;
      const symBody = sym
        ? rxRow("호소 내용", sym, isPass) +
          (data.symptom_original
            ? rxRow("환자 원문", data.symptom_original + (data.symptom_locale ? " (" + data.symptom_locale + ")" : ""), false)
            : "")
        : '<div class="rx-row"><span class="rx-val" style="color:#94a3b8;font-weight:500;">환자가 선택한 증상이 없습니다</span></div>';

      // ③ 보험 확인
      const insActive = data.insurance_active === true || !!data.insurance_product;
      const insBody = insActive
        ? rxRow("가입 상태", val(data.insurance_product, "일상 상해보험") + " 가입 유효 ✓", false) +
          rxRow("보험사", val(data.insurance_company, "제휴 손해보험사"), false)
        : '<div class="rx-row"><span class="rx-val" style="color:#94a3b8;font-weight:500;">가입 정보 없음 — 접수는 그대로 진행됩니다</span></div>';

      const dim = isPass ? "" : ' style="opacity:.55;"';

      return `
        <div class="rx-panel">
          <div class="rx-head">
            <span>대구 ○○의원 · iM 제휴병원 ✓ · HOSP-001</span>
            <span>${new Date().toLocaleTimeString('ko-KR')} · 초진</span>
          </div>
          ${banner}

          <div class="rx-block"${dim}>
            <div class="rx-btitle">
              <span>환자 기본정보</span>
              ${isPass ? '<button class="rx-mini" onclick="rxCopyAll(this)">전체 복사</button>' : ""}
            </div>
            ${rxRow("성명", name, isPass)}
            <div class="rx-row">
              <span class="rx-label">외국인등록번호</span>
              <span class="rx-val" id="rxRegNo">${esc(rxMask(regNo))}</span>
              ${regBtns}
            </div>
            ${rxRow("생년월일 / 성별", (birth === "—" && gender === "—") ? "—" : (birth + " / " + gender), isPass)}
            ${rxRow("국적", nat, isPass)}
            <div class="rx-row">
              <span class="rx-label">체류자격 확인</span>
              <span class="rx-val">
                <span class="${isPass ? "rx-ok" : "rx-bad"}">${esc(visa)} ${isPass ? "✓" : "✗"}</span>${visaEnd === "—" ? "" : " · 만료 " + esc(visaEnd)}
              </span>
            </div>
            <div class="rx-note">※ 건강보험 자격은 병원 시스템에서 조회하십시오. 이 화면은 조회에 필요한 인적사항만 제공합니다.</div>
          </div>

          <div class="rx-block rx-selfdecl"${dim}>
            <div class="rx-btitle">
              <span>환자 진술</span>
              ${(sym && isPass) ? '<button class="rx-mini" onclick="rxCopy(\'' + esc(String(sym)).replace(/'/g, "\\'") + '\', this)">증상 복사</button>' : ""}
            </div>
            <div class="rx-warn">※ 환자 본인의 진술이며 진단이 아닙니다. 기관이 증명한 내용이 아닙니다.</div>
            ${symBody}
          </div>

          <div class="rx-block rx-insurance"${dim}>
            <div class="rx-btitle"><span>보험 확인</span></div>
            ${insBody}
            <div class="rx-note">※ 가입 사실 확인이며 병원에 대한 지급보증이 아닙니다.</div>
          </div>

          <div class="rx-block">
            <details ${(okChain && isPass) ? "" : "open"}>
              <summary class="rx-btitle" style="cursor:pointer;">
                <span>검증 상태</span>
                <span class="${(okChain && isPass) ? "rx-ok" : "rx-bad"}">${(okChain && isPass) ? "통과 ✓" : "실패 ✗"}</span>
              </summary>
              <div style="margin-top:8px;">
                <div class="rx-grid">
                  ${rxRow("온체인 상태", val(chainName, "조회 안 됨") + (p.status_code !== undefined ? " (코드 " + p.status_code + ")" : ""), false)}
                  ${rxRow("QR 소비", isPass ? "1회 소비됨 ✓" : val(reason, "—"), false)}
                  ${rxRow("검증 네트워크", p.mode === "live_testnet" ? "Polygon Amoy Testnet" : "EVM On-Chain Simulator", false)}
                  ${rxRow("수령처 대조", isPass ? "HOSP-001 일치 ✓" : "HOSP-001", false)}
                </div>
                ${p.credential_hash ? rxRow("식별 해시", p.credential_hash, true) : ""}
              </div>
            </details>
          </div>

          <div class="rx-foot">
            접수 보조용 화면입니다. 병원 전산 입력·진료과 배정·진단은 담당자와 의료진의 판단입니다.
          </div>
        </div>`;
    }

    // 이직(사업장 변경) 서류 대사표.
    // 검증된 것만 초록으로 그리지 않고, 크리덴셜로 대체할 수 없는 서류까지 같이 보여준다.
    function renderCompanyPanel(data) {
      const esc = (v) => String(v == null ? "—" : v);
      const d = data.dossier;
      const head = `
        <div class="agency-card">
          <div class="agency-title">사내 ERP 급여계좌 자동 연동 완료</div>
          <div>• 근로자: <b>${esc(data.worker_name)}</b> (${esc(data.nationality)})</div>
          <div>• 지급 계좌: <b>${esc(data.account_bank)} ${esc(data.account_number)}</b> (검증필)</div>
          <div style="font-size:12px;color:#16a34a;margin-top:4px;">✓ 인사/회계 시스템 자동 등록 완료 (수기입력 0건)</div>
        </div>`;
      if (!d) return head;

      const row = (left, right, color) => `
        <div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #eef2f7;font-size:13px;">
          <span style="color:#334155;white-space:nowrap;">${esc(left)}</span>
          <span style="color:${color};text-align:right;">${esc(right)}</span>
        </div>`;

      const block = (title, badge, badgeColor, bg, items) => `
        <div style="background:${bg};border-radius:8px;padding:10px 12px;margin-top:10px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:4px;">
            ${esc(title)} <span style="color:${badgeColor};font-weight:500;">${esc(badge)}</span>
          </div>
          ${items}
        </div>`;

      const verified = d.verified.map(v =>
        row(`✓ ${v.name}`, `${v.value}  ·  ${v.issuer}`, "#15803d")).join("");
      const attached = d.attached.map(v =>
        row(`${v.name}`, v.note, "#64748b")).join("");
      const required = d.required.map(v =>
        row(`○ ${v.name}`, v.note, "#b45309")).join("");
      const procedure = (d.procedure || []).map(v =>
        row(`▸ ${v.name}`, v.note, "#475569")).join("");

      const notice = (d.notice && d.notice.length)
        ? `<div style="margin-top:10px;font-size:12px;color:#b45309;line-height:1.6;">
             ${d.notice.map(n => "· " + esc(n)).join("<br/>")}
           </div>`
        : "";

      return `
        ${head}
        <div class="agency-card" style="margin-top:10px;">
          <div class="agency-title">이직(사업장 변경) 서류 대사표</div>
          <div style="font-size:12px;color:#64748b;">
            본 사업장 기준 — 블록체인 검증 ${d.summary.verified}건 · 파일 동봉 ${d.summary.attached}건 · 별도 제출 ${d.summary.required}건
          </div>
          ${block("블록체인으로 검증됨", "(수기 확인 불필요)", "#15803d", "#f0fdf4", verified)}
          ${block("지갑에 동봉된 파일", "(검증 대상 아님 · 담당자 확인)", "#64748b", "#f8fafc", attached)}
          ${block("크리덴셜로 대체 불가", "(본 사업장 제출 · 실물 대조)", "#b45309", "#fffbeb", required)}
          ${procedure ? block("행정 절차 (본 사업장 제출 대상 아님)", "(진행 여부만 확인)", "#475569", "#f1f5f9", procedure) : ""}
          ${notice}
          <div style="font-size:11.5px;color:#94a3b8;margin-top:8px;">
            절차 근거: 고용센터 사업장변경 신청 → 구직·알선 → 고용허가서 발급 → 출입국 근무처변경허가.
            횟수·기한 규정은 제도 개정에 따라 달라질 수 있습니다.
          </div>
        </div>`;
    }

    function showResult(data, verifierId) {
      const box = document.getElementById("resultBox");
      // 서버가 pass라고 해도 온체인 상태가 VALID가 아니면 화면은 통과로 그리지 않는다.
      // (AGENTS.md 규칙 3 — 판정은 수령처 화면이 한다. 완전한 브라우저 검증은 별도 작업)
      const chainName = String(data.onchain_proof?.status_name || "").toUpperCase();
      const chainOk = !data.onchain_proof || chainName === "VALID";
      const isPass = data.result === "pass" && chainOk;
      if (data.result === "pass" && !chainOk) {
        data = { ...data, reason: data.reason || `ONCHAIN_${chainName}` };
      }

      let agencyHtml = "";
      // 병원은 실패해도 패널을 그린다 — 왜 막혔는지 보여줘야 하기 때문.
      if (verifierId === "hospital_1") {
        agencyHtml = renderHospitalPanel(data, isPass);
      } else if (isPass) {
        if (verifierId === "company_A") {
          agencyHtml = renderCompanyPanel(data);
        }
      }

      const proofHtml = (data.onchain_proof && verifierId !== "hospital_1") ? `
        <div class="proof-box">
          <b><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true' style='display:inline-block;vertical-align:-3px;width:16px;height:16px;'><path d='M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 1 0-5.7-5.7L11.6 6.7'/><path d='M13.5 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 1 0 5.7 5.7l1.2-1.2'/></svg> 블록체인 온체인 증명 (On-Chain Proof)</b><br/>
          • 상태: <b>${data.onchain_proof.status_name.toUpperCase()} (코드: ${data.onchain_proof.status_code})</b><br/>
          • 식별 해시: <code>${data.onchain_proof.credential_hash}</code><br/>
          • 검증 네트워크: ${data.onchain_proof.mode === 'live_testnet' ? 'Polygon Amoy Testnet' : 'EVM On-Chain Simulator'}<br/>
        </div>
      ` : '';

      let failureExpl = "";
      if (!isPass) {
        const r = String(data.reason || "");
        if (r.includes("SIGNATURE") || r.includes("INVALID")) {
          failureExpl = `<div style="margin-top:6px;font-size:13.5px;color:#fca5a5;"><b>전자서명 불일치 (데이터 위변조 차단)</b><br/><span style="font-size:12px;opacity:0.9;">근로자 신원 정보 또는 급여계좌가 서명 시점과 일치하지 않아 차단되었습니다.</span></div>`;
        } else if (r.includes("TARGET") || r.includes("MISMATCH")) {
          failureExpl = `<div style="margin-top:6px;font-size:13.5px;color:#fde68a;"><b>제출 대상 기관 불일치 (오배송 차단)</b><br/><span style="font-size:12px;opacity:0.9;">이 QR은 다른 기관 제출용으로 생성되었습니다. 현재 단말의 식별자와 일치하지 않습니다.</span></div>`;
        } else if (r.includes("REVOKED")) {
          failureExpl = `<div style="margin-top:6px;font-size:13.5px;color:#fca5a5;"><b>체류자격 온체인 철회 (REVOKED)</b><br/><span style="font-size:12px;opacity:0.9;">스마트 컨트랙트 원장에 체류자격 철회 트랜잭션이 기록되어 즉시 무효화되었습니다.</span></div>`;
        } else {
          failureExpl = `<div style="margin-top:6px;font-size:13.5px;color:#fca5a5;"><b>${esc(data.message || "검증에 실패했습니다.")}</b></div>`;
        }
      }

      const CHK = "<svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='m5 12.5 4.5 4.5L19 7.5'/></svg>";
      const XMK = "<svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 6l12 12M18 6 6 18'/></svg>";
      box.innerHTML = `
        <div class="${isPass ? "result-pass" : "result-fail"}">
          ${isPass ? CHK : XMK}
          <div style="flex:1;min-width:0;">
            <b style="display:block;font-size:19px;letter-spacing:-0.5px;">
              ${verifierId === "hospital_1"
                ? (isPass ? "본인이 맞습니다, 접수하셔도 돼요" : "환자 신분을 확인할 수 없어요")
                : (isPass ? "근무 가능한 근로자입니다" : "현재 자격을 확인할 수 없어요")}
            </b>
            <span class="badge ${isPass ? "chain" : "revoked"}" style="margin-top:8px;">
              ${isPass ? "분산원장 등록 확인됨" : "분산원장 대조 실패"}
            </span>
            ${failureExpl}
            ${!isPass ? `<details class="fold" style="margin-top:10px;"><summary style="font-size:12px;color:var(--im-subtext);font-weight:600;"><span>자세한 검증 정보 보기</span><span class="chev">▾</span></summary><pre style="margin-top:8px;">${esc(data.reason || "UNKNOWN_ERROR")}</pre></details>` : ""}
          </div>
        </div>
        ${agencyHtml}
        ${proofHtml}`;
    }
  </script>
  </div>
  <div class="rolebar"><a href="home.html"><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><path d='m15 18-6-6 6-6'/></svg>서비스 선택으로</a></div>
<script>
  // 언어 선택기는 i18n.js가 그린다. setLang()이 translatePage()를 자동 호출하므로
  // data-i18n 이 없는 문구도 번역된다. 개인정보에는 data-no-translate 를 붙여 둔다.
  // i18n.js 가 없거나 못 뜨더라도 화면은 그대로 동작해야 한다.
  // i18n.js 는 최상위 `const I18N = {...}` 로 선언한다. 클래식 스크립트의 const 는
  // 전역 렉시컬 바인딩만 만들고 window 의 속성이 되지 않으므로 `window.I18N` 은 항상 undefined 다.
  // typeof 로 봐야 한다. 이걸 틀려서 언어 선택기가 전 화면에서 안 떴다.
  if (typeof I18N !== "undefined") {
    I18N.renderSelector("langSelectorArea");
    window.addEventListener("imwp-lang-change", () => I18N.apply());
  }
</script>
</body>
</html>
