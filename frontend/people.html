<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>iM Worker Pass - 인물 선택</title>
<link rel="stylesheet" href="ui.css?v=3" />
<script src="i18n.js?v=3"></script>
<style>
  .who { display:grid; gap:var(--space-2); margin-top:var(--space-1); }
  .who button {
    width:100%; text-align:left; margin:0; min-height:0;
    background:var(--im-surface); color:var(--im-text);
    border:1.5px solid var(--im-line); border-radius:var(--radius-input);
    padding:14px 16px; display:flex; align-items:center; gap:var(--space-3); cursor:pointer;
  }
  .who button:hover { border-color:var(--role); background:var(--role-light); }
  .who .flag {
    font-size:var(--font-micro); font-weight:600; color:var(--im-subtext);
    background:var(--im-surface-soft); border-radius:var(--radius-chip);
    padding:4px 10px; white-space:nowrap; flex:none;
  }
  .who .info { flex:1; min-width:0; }
  .who .nm { display:block; font-size:15px; font-weight:700; letter-spacing:-.4px; color:var(--im-black); }
  .who .de { display:block; font-size:var(--font-caption); color:var(--im-subtext); margin-top:3px; line-height:1.5; }
  .who .blocked { color:var(--im-red); font-weight:600; }
  .who .chev { color:var(--im-disabled); flex:none; }
  .grp { font-size:var(--font-micro); color:var(--im-disabled); margin:var(--space-5) 0 var(--space-2); font-weight:600; }
  .grp:first-of-type { margin-top:var(--space-1); }
  .rolebar { padding:var(--space-4) var(--space-5) var(--space-6); }
  .rolebar a {
    display:inline-flex; align-items:center; gap:6px;
    font-size:var(--font-caption); font-weight:600; color:var(--im-subtext);
  }
  .rolebar a:hover { color:var(--im-text); }
</style>
</head>
<body class="role-phone">
<div class="phone">
  <header class="ph-top">
    <div class="ph-top-bar">
      <span class="ph-brand"><svg class='mark' viewBox='0 0 26 23' fill='none' xmlns='http://www.w3.org/2000/svg' aria-hidden='true'><path d='M3 19.5V8.2c0-1.9 2.4-2.8 3.6-1.3L13 14.8l6.4-7.9C20.6 5.4 23 6.3 23 8.2v11.3' stroke='#00C7A9' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg><span class="nm">iM PASS</span><span class="role">근로자</span></span>
      <span class="acts">
        <div id="langSelectorArea"></div>
        <svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><path d='M18 8.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5Z'/><path d='M10.3 19a2 2 0 0 0 3.4 0'/></svg>
        <a href="home.html" class="switch-link"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true' style='width:13px;height:13px;stroke-width:2.4;'><path d='M4 8.5h13M13.5 5 17 8.5 13.5 12'/><path d='M20 15.5H7M10.5 12 7 15.5 10.5 19'/></svg>서비스 전환</a>
      </span>
    </div>
    <h1>누구로 볼까요</h1>
    <div class="who">외국인 근로자 프로필 선택 (E-9 / H-2)</div>
  </header>
  <main class="ph-body">

  <p style="font-size:12.5px;color:#64748b;margin:0 0 14px;line-height:1.7;">
    실제 서비스에서 근로자는 자기 지갑 하나만 갖습니다. 고르면 그 사람으로 지갑 발급부터 시작합니다.
  </p>

  <div class="card">
    <div class="grp">E-9 비전문취업 (고용허가제)</div>
    <div class="who">
      <button onclick="pick('NGUYEN VAN A')">
        <span class="flag">베트남</span>
        <span class="info"><span class="nm">NGUYEN VAN A</span>
          <span class="de">제조(금속가공) · CNC 선반 — 표준 사례</span></span><svg class='ico ico-sm chev' viewBox='0 0 24 24' aria-hidden='true'><path d='m9 18 6-6-6-6'/></svg>
      </button>
      <button onclick="pick('SITI RAHAYU')">
        <span class="flag">인도네시아</span>
        <span class="info"><span class="nm">SITI RAHAYU</span>
          <span class="de">제조(식품) · 사출 성형 — 이번 달 결근 1일</span></span><svg class='ico ico-sm chev' viewBox='0 0 24 24' aria-hidden='true'><path d='m9 18 6-6-6-6'/></svg>
      </button>
      <button onclick="pick('NGUYEN THI E')">
        <span class="flag">베트남</span>
        <span class="info"><span class="nm">NGUYEN THI E</span>
          <span class="de blocked">제조(전자) — 체류자격 말소 <svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true' style='display:inline-block;vertical-align:-3px;width:16px;height:16px;'><circle cx='12' cy='12' r='9'/><path d='M12 7.5v5.2M12 16.2v.2'/></svg> 2단계에서 막힙니다</span></span><svg class='ico ico-sm chev' viewBox='0 0 24 24' aria-hidden='true'><path d='m9 18 6-6-6-6'/></svg>
      </button>
    </div>

    <div class="grp">H-2 방문취업 (동포 특례고용)</div>
    <div class="who">
      <button onclick="pick('LI CHUNHUA')">
        <span class="flag">중국</span>
        <span class="info"><span class="nm">LI CHUNHUA</span>
          <span class="de">품질 검사 — 체류 만료 임박</span></span><svg class='ico ico-sm chev' viewBox='0 0 24 24' aria-hidden='true'><path d='m9 18 6-6-6-6'/></svg>
      </button>
    </div>

    <p style="font-size:12px;color:#94a3b8;line-height:1.7;margin:16px 0 0;">
      체류자격마다 이직 규정이 다르고, 요구되는 한국어 시험과 안전교육도 다릅니다.
      기관별 보유 정보도 사람마다 달라서, 조회 결과가 전부 같게 나오지 않습니다.
    </p>
  </div>

<script>
  // 고른 사람을 지갑 화면에 넘긴다. 기존 지갑은 비워서 발급 화면부터 시작한다.
  function pick(name) {
    try {
      localStorage.setItem("imwp_pick_worker", name);
      localStorage.removeItem("imwp_credential_id");
    } catch (e) {}
    // 이름을 주소에 함께 싣는다. localStorage 가 막혀 있어도 전달되고,
    // 뒤에 붙는 t 값이 매번 달라 브라우저가 옛 지갑 화면을 캐시에서 꺼내 쓰지 못한다.
    location.href = "wallet.html?who=" + encodeURIComponent(name) + "&t=" + Date.now();
  }
</script>
  </main>
  <div class="rolebar"><a href="home.html"><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><path d='m15 18-6-6 6-6'/></svg>서비스 선택으로</a></div>
</div>
<script>
  // 언어 선택기는 i18n.js가 그린다. setLang()이 translatePage()를 자동 호출하므로
  // data-i18n 이 없는 문구도 번역된다. 개인정보에는 data-no-translate 를 붙여 둔다.
  // i18n.js 가 없거나 못 뜨더라도 화면은 그대로 동작해야 한다.
  // i18n.js 는 최상위 `const I18N = {...}` 로 선언한다. 클래식 스크립트의 const 는
  // 전역 렉시컬 바인딩만 만들고 window 의 속성이 되지 않으므로 `window.I18N` 은 항상 undefined 다.
  // typeof 로 봐야 한다. 이걸 틀려서 언어 선택기가 전 화면에서 안 떴다.
  if (typeof I18N !== "undefined") {
    I18N.renderSelector("langSelectorArea");
    window.addEventListener("imwp-lang-change", () => I18N.apply());
  }
</script>
</body>
</html>
