<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iM Worker Pass - 인물 선택</title>
<link rel="stylesheet" href="ui.css" />
<style>
  .who { display:grid; gap:10px; margin-top:4px; }
  .who button { width:100%; text-align:left; background:#fff; color:#0f172a;
    border:1px solid #e2e8f0; border-radius:12px; padding:14px 16px; margin:0;
    display:flex; align-items:center; gap:14px; cursor:pointer; }
  .who button:hover { border-color:#0f172a; background:#f8fafc; }
  .who .flag { font-size:11px; color:#475569; background:#f1f5f9; border-radius:999px;
    padding:3px 9px; white-space:nowrap; flex:none; }
  .who .nm { font-size:15px; font-weight:700; letter-spacing:-.3px; }
  .who .de { font-size:12.5px; color:#64748b; margin-top:2px; }
  .who .blocked { color:#a92c22; }
  .grp { font-size:12px; color:#94a3b8; margin:16px 0 6px; font-weight:600; }
  .grp:first-of-type { margin-top:4px; }
</style>
</head>
<body class="role-phone">
<div class="phone">
  <header class="ph-top">
    <div class="brand">iM Worker Pass</div>
    <h1>누구로 볼까요</h1>
    <div class="who">심사에서 여러 인물을 비교하기 위한 입구입니다</div>
  </header>
  <main class="ph-body">

  <p style="font-size:12.5px;color:#64748b;margin:0 0 14px;line-height:1.7;">
    실제 서비스에서 근로자는 자기 지갑 하나만 갖습니다. 고르면 그 사람으로 지갑 발급부터 시작합니다.
  </p>

  <div class="card">
    <div class="grp">E-9 비전문취업 (고용허가제)</div>
    <div class="who">
      <button onclick="pick('NGUYEN VAN A')">
        <span class="flag">베트남</span>
        <span><span class="nm">NGUYEN VAN A</span>
          <span class="de">제조(금속가공) · CNC 선반 — 표준 사례</span></span>
      </button>
      <button onclick="pick('SITI RAHAYU')">
        <span class="flag">인도네시아</span>
        <span><span class="nm">SITI RAHAYU</span>
          <span class="de">제조(식품) · 사출 성형 — 이번 달 결근 1일</span></span>
      </button>
      <button onclick="pick('NGUYEN THI E')">
        <span class="flag">베트남</span>
        <span><span class="nm">NGUYEN THI E</span>
          <span class="de blocked">제조(전자) — 체류자격 말소 ⛔ 2단계에서 막힙니다</span></span>
      </button>
    </div>

    <div class="grp">H-2 방문취업 (동포 특례고용)</div>
    <div class="who">
      <button onclick="pick('LI CHUNHUA')">
        <span class="flag">중국</span>
        <span><span class="nm">LI CHUNHUA</span>
          <span class="de">품질 검사 — 체류 만료 임박</span></span>
      </button>
    </div>

    <p style="font-size:12px;color:#94a3b8;line-height:1.7;margin:16px 0 0;">
      체류자격마다 이직 규정이 다르고, 요구되는 한국어 시험과 안전교육도 다릅니다.
      기관별 보유 정보도 사람마다 달라서, 조회 결과가 전부 같게 나오지 않습니다.
    </p>
  </div>

<script>
  // 고른 사람을 지갑 화면에 넘긴다. 기존 지갑은 비워서 발급 화면부터 시작한다.
  function pick(name) {
    try {
      localStorage.setItem("imwp_pick_worker", name);
      localStorage.removeItem("imwp_credential_id");
    } catch (e) {}
    // 이름을 주소에 함께 싣는다. localStorage 가 막혀 있어도 전달되고,
    // 뒤에 붙는 t 값이 매번 달라 브라우저가 옛 지갑 화면을 캐시에서 꺼내 쓰지 못한다.
    location.href = "wallet.html?who=" + encodeURIComponent(name) + "&t=" + Date.now();
  }
</script>
  </main>
  <div class="rolebar"><a href="home.html">← 역할 선택으로</a></div>
</div>
</body>
</html>
