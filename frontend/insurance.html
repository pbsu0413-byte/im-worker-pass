<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보험 인앱 인증</title><link rel="stylesheet" href="style.css"></head><body><nav><a href="issue.html">지갑</a><a href="scan.html">스캐너</a><a class="active" href="insurance.html">보험</a><a href="admin.html">관리자</a></nav><h1>○○손해보험 · QR 없는 인앱 인증</h1><div class="card"><p>상품: 외국인 근로자 안심 상해보험</p><p>추가 서류 0건 · 추가 본인확인 0회 · QR 0회</p><label>Credential ID</label><input id="credentialId" placeholder="지갑에서 확인한 credential_id"><button onclick="enroll()">인증하기</button><div id="resultBox"></div></div><script src="config.js"></script><script>async function enroll(){const id=document.getElementById('credentialId').value.trim();if(!id){document.getElementById('resultBox').textContent='Credential ID를 입력하세요.';return}const r=await fetch(`${API_BASE_URL}/insurance/enroll`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential_id:id})});const d=await r.json();document.getElementById('resultBox').innerHTML=r.ok?`<div class="result-pass">✅ 보험 가입 완료<br>추가 서류 0건 · 본인확인 0회 · QR 0회<br>근로자: ${d.worker_name}</div>`:`<div class="result-fail">❌ ${d.detail||'인증 실패'}</div>`}</script></body></html>
