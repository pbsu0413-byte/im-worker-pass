<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iM Worker Pass - 근태</title>
<link rel="stylesheet" href="ui.css" />
<style>
  .kpi { display:flex; gap:8px; margin-top:10px; }
  .kpi div { flex:1; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px; text-align:center; }
  .kpi b { display:block; font-size:20px; }
  .kpi span { font-size:11.5px; color:#64748b; }
  .rec { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid #eef2f7; font-size:13px; }
  .in { color:#15803d; font-weight:600; }
  .out { color:#2563eb; font-weight:600; }
  .ok { background:#e6f7ee; border:1px solid #2ecc71; color:#1e7e45; padding:14px; border-radius:10px; margin-top:12px; }
  .no { background:#fdecea; border:1px solid #e74c3c; color:#a92c22; padding:14px; border-radius:10px; margin-top:12px; }
  .muted { font-size:11.5px; color:#94a3b8; margin-top:8px; line-height:1.6; }
</style>
</head>
<body class="role-kiosk">
  <div class="ks-top-bar">
    <span class="ph-brand"><span class="nm">iM PASS</span><span class="role">사업자</span></span>
    <span class="acts">
      <svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><path d='M18 8.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5Z'/><path d='M10.3 19a2 2 0 0 0 3.4 0'/></svg><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='3.2'/><path d='M4.8 15.4a1.7 1.7 0 0 0-.4 1.9l.6 1a1.7 1.7 0 0 0 1.7.8l1.3-.2 1.6.9.5 1.2a1.7 1.7 0 0 0 1.6 1h1.2a1.7 1.7 0 0 0 1.6-1l.5-1.2 1.6-.9 1.3.2a1.7 1.7 0 0 0 1.7-.8l.6-1a1.7 1.7 0 0 0-.4-1.9l-.9-1v-1.8l.9-1a1.7 1.7 0 0 0 .4-1.9l-.6-1a1.7 1.7 0 0 0-1.7-.8l-1.3.2-1.6-.9-.5-1.2a1.7 1.7 0 0 0-1.6-1h-1.2a1.7 1.7 0 0 0-1.6 1l-.5 1.2-1.6.9-1.3-.2a1.7 1.7 0 0 0-1.7.8l-.6 1a1.7 1.7 0 0 0 .4 1.9l.9 1v1.8l-.9 1Z'/></svg>
      <a href="home.html" class="btn-switch-service"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true' style='width:13px;height:13px;stroke-width:2.4;'><path d='M4 8.5h13M13.5 5 17 8.5 13.5 12'/><path d='M20 15.5H7M10.5 12 7 15.5 10.5 19'/></svg>서비스 전환</a>
    </span>
  </div>

  <div class="ks-head">
    <h1>사업장 근태 시스템</h1>
    <span class="site">출입구 단말 · 실시간 근태 및 온체인 출입 검증</span>
  </div>
  <div class="orgbar">
    <a href="scan.html">자격 확인</a>
    <a href="attendance.html" class="on">근태 등록</a>
  </div>
  <div class="ks-wrap">

  <p style="font-size:13px;color:#64748b;margin-top:-6px;">
    근태 기록은 <b>회사 시스템</b>에 남습니다. 은행은 "이 사람이 유효한가"만 답하고 근무 시각은 보지 않습니다.
  </p>

  <div class="card">
    <h3>출입 스캐너</h3>
    <label>스캐너</label>
    <select id="scannerId" onchange="loadSite()">
      <option value="SCANNER-BIZ-001">SCANNER-BIZ-001 — A제조 (주)대구정밀</option>
      <option value="SCANNER-BIZ-002">SCANNER-BIZ-002 — B제조 (주)구미사출</option>
    </select>
    <label>QR payload 붙여넣기</label>
    <textarea id="payload" rows="3" placeholder='{"v":1,"t":"..."}'></textarea>
    <button onclick="scan()">스캔</button>
    <div id="result"></div>
    <div class="muted">
      공장은 개인 카메라 사용이 제한되는 곳이 많아, 근로자가 QR을 만들고 사업장 스캐너가 읽는 방향입니다.
      스캐너가 사업장에 고정되어 있으므로 위치는 스캐너가 보증합니다.
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;">오늘 현황</h3>
      <button class="secondary" style="margin:0;padding:7px 12px;font-size:13px;" onclick="loadSite()">새로고침</button>
    </div>
    <div class="kpi" id="kpi"></div>
    <div id="records" style="margin-top:10px;"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const esc = (v) => String(v == null || v === "" ? "—" : v);
    const hhmm = (iso) => { try { return new Date(iso).toLocaleString("ko-KR", { hour12:false }); } catch(e){ return iso; } };

    async function scan() {
      const box = document.getElementById("result");
      let payload;
      try { payload = JSON.parse(document.getElementById("payload").value.trim()); }
      catch (e) { box.innerHTML = `<div class="no">payload 형식이 올바르지 않습니다.</div>`; return; }

      const res = await fetch(`${API_BASE_URL}/attendance/scan`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ payload, scanner_id: document.getElementById("scannerId").value }),
      });
      const d = await res.json();

      if (!res.ok) {
        box.innerHTML = `<div class="no"><b><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true' style='display:inline-block;vertical-align:-3px;width:16px;height:16px;'><path d='M6 6l12 12M18 6 6 18'/></svg> 스캔 실패</b><br/>${esc(d.detail)}</div>`;
        return;
      }
      if (d.result !== "pass") {
        box.innerHTML = `
          <div class="no">
            <b><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true' style='display:inline-block;vertical-align:-3px;width:16px;height:16px;'><circle cx='12' cy='12' r='9'/><path d='M12 7.5v5.2M12 16.2v.2'/></svg> 출근 차단 — ${esc(d.reason)}</b><br/>
            ${esc(d.worker_name)}<br/>
            <span style="font-size:12.5px;">${esc(d.message)}</span><br/>
            <span style="font-size:12px;">온체인 상태: <b>${esc(d.onchain_proof?.status_name).toUpperCase()}</b></span>
          </div>
          <div class="muted">
            체류자격이 취소된 근로자를 모르고 고용하는 위험을 사업장이 덜어냅니다.
            기관마다 연락을 돌릴 필요 없이, 체인 상태 하나로 즉시 반영됩니다.
          </div>`;
        loadSite();
        return;
      }

      const r = d.record;
      box.innerHTML = `
        <div class="ok">
          <b><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true' style='display:inline-block;vertical-align:-3px;width:16px;height:16px;'><path d='m5 12.5 4.5 4.5L19 7.5'/></svg> ${r.check_type === "in" ? "출근" : "퇴근"} 기록됨</b><br/>
          ${esc(r.worker_name)} · ${esc(r.site_name)}<br/>
          <span style="font-size:12.5px;">${hhmm(r.server_time)} (회사 스캐너 기준 시각)</span>
          ${r.worked_minutes != null ? `<br/><span style="font-size:12.5px;">근무 ${Math.floor(r.worked_minutes/60)}시간 ${r.worked_minutes%60}분</span>` : ""}
        </div>`;
      document.getElementById("payload").value = "";
      loadSite();
    }

    async function loadSite() {
      const scanner = document.getElementById("scannerId").value;
      const siteId = scanner === "SCANNER-BIZ-001" ? "BIZ-001" : "BIZ-002";
      const res = await fetch(`${API_BASE_URL}/attendance/site/${siteId}`);
      const d = await res.json();
      const s = d.summary;

      document.getElementById("kpi").innerHTML = `
        <div><b>${s.currently_working}</b><span>근무 중</span></div>
        <div><b>${s.check_in}</b><span>출근</span></div>
        <div><b>${s.check_out}</b><span>퇴근</span></div>
        <div><b>${s.scans}</b><span>오늘 스캔</span></div>`;

      const rows = d.records || [];
      document.getElementById("records").innerHTML = rows.length
        ? rows.map(r => `
            <div class="rec">
              <span><b>${esc(r.worker_name)}</b>
                <span class="${r.check_type}">${r.check_type === "in" ? "출근" : "퇴근"}</span></span>
              <span style="color:#64748b;">${hhmm(r.server_time)}${
                r.worked_minutes != null ? ` · ${Math.floor(r.worked_minutes/60)}h ${r.worked_minutes%60}m` : ""}</span>
            </div>`).join("")
        : `<p style="font-size:13px;color:#94a3b8;">기록이 없습니다. 제출 화면에서 출퇴근 QR을 만들어 스캔해 보세요.</p>`;
    }

    loadSite();
    setInterval(loadSite, 10000);
  </script>
  </div>
  <div class="rolebar"><a href="home.html"><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><path d='m15 18-6-6 6-6'/></svg>서비스 선택으로</a></div>
</body>
</html>
