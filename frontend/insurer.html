    <div class="cs-main">
  <div class="cs-head">
    <span class="mark">iM</span>
    <h1>손해보험 행정 처리</h1>
    <span class="sub">제휴 손해보험사 심사 접수함</span>
  </div>
  <div class="cs-wrap">

  <p class="tx-caption" style="margin:0 0 16px;max-width:760px;">
    근로자가 앱에서 보낸 가입 신청이 여기에 쌓여요. 담당자가 내용을 확인하고 승인하면 처리가 끝납니다.
  </p>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;">접수 목록</h3>
      <button class="secondary" style="margin:0;padding:7px 12px;font-size:13px;" onclick="load()">새로고침</button>
    </div>
    <label>담당자</label>
    <input id="officer" value="심사팀 김OO" />
    <div id="list"></div>
  </div>

  <script src="config.js?v=3"></script>
  <script>
    const esc = (v) => String(v == null || v === "" ? "—" : v);
    const LABELS = { submitted: "심사 대기", approved: "승인 완료", rejected: "거절" };

    async function load() {
      const res = await fetch(`${API_BASE_URL}/insurance/submissions`);
      const data = await res.json();
      const rows = data.submissions || [];
      const box = document.getElementById("list");
      if (!rows.length) {
        box.innerHTML = `<p style="font-size:13px;color:#94a3b8;">접수된 건이 없습니다. 보험 가입 화면에서 전송해 보세요.</p>`;
        return;
      }
      box.innerHTML = rows.map(render).join("");
    }

    function render(d) {
      const chain = String(d.onchain_proof?.status_name || "").toUpperCase();
      const ok = d.verified && chain === "VALID";
      const badge = d.status === "approved" ? "badge-valid" : d.status === "rejected" ? "badge-revoked" : "";
      const fields = d.disclosure_labels.map(f => `
        <div class="row"><span>${esc(f.label)}</span><span>${esc(d.disclosure[f.key])}</span></div>`).join("");
      const actions = d.status === "submitted" ? `
        <div class="btns">
          <button onclick="decide('${d.submission_id}','approve')">승인</button>
          <button class="danger" onclick="decide('${d.submission_id}','reject')">거절</button>
        </div>` : `
        <div class="meta" style="margin-top:8px;">
          처리 ${esc(d.decided_at)} · ${esc(d.decided_by)}
          ${d.policy_no ? " · 증권번호 " + esc(d.policy_no) : ""}
          ${d.reason ? " · 사유 " + esc(d.reason) : ""}
        </div>`;

      return `
        <div class="sub">
          <div class="sub-head">
            <b>${esc(d.submission_id)} · ${esc(d.product.name)}</b>
            <span class="badge ${badge}">${esc(LABELS[d.status] || d.status)}</span>
          </div>
          <div class="meta">접수 ${esc(d.submitted_at)} · 수령처 ${esc(d.audience)}</div>
          <div class="rows">${fields}</div>
          <div class="chk ${ok ? "" : "bad"}">
            ${ok ? "✓" : "✗"} 온체인 상태 ${esc(chain)} ·
            수령처 대조 ${d.audience === "INS-001" ? "일치" : "불일치"} ·
            서류 접수 0건
          </div>
          ${actions}
        </div>`;
    }

    async function decide(id, decision) {
      const officer = document.getElementById("officer").value.trim();
      const body = { decision, officer };
      if (decision === "reject") {
        const reason = prompt("거절 사유를 입력하세요.", "심사 기준 미충족");
        if (reason === null) return;
        body.reason = reason;
      }
      const res = await fetch(`${API_BASE_URL}/insurance/submissions/${id}/decide`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) { alert("오류: " + JSON.stringify(data)); }
      load();
    }

    load();
    setInterval(load, 5000);
  </script>
  </div>
  </div></div>

<script>
  // 언어 선택기는 i18n.js가 그린다. setLang()이 translatePage()를 자동 호출하므로
  // data-i18n 이 없는 문구도 번역된다. 개인정보에는 data-no-translate 를 붙여 둔다.
  // i18n.js 가 없거나 못 뜨더라도 화면은 그대로 동작해야 한다.
  if (window.I18N) {
    I18N.renderSelector("langSelectorArea");
    window.addEventListener("imwp-lang-change", () => I18N.apply());
  }
</script>
