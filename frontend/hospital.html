<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>병원 접수</title><link rel="stylesheet" href="style.css"></head><body><nav><a href="issue.html">지갑</a><a href="scan.html">회사 스캐너</a><a class="active" href="hospital.html">병원</a><a href="insurance.html">보험</a><a href="admin.html">관리자</a></nav><h1>대구 ○○의원 · 접수</h1><div class="card"><h3>환자 진술 증상</h3><p class="muted">환자 본인의 진술이며 진단이 아닙니다.</p><select id="symptom"><option>기침이 있어요</option><option>허리가 아파요</option><option>열이 나는 것 같아요</option><option>속이 불편해요</option><option>피부가 가려워요</option></select><h3>QR 접수</h3><textarea id="payload" rows="4" placeholder='지갑 QR의 {"v":1,"t":"..."}를 붙여넣으세요'></textarea><button onclick="intake()">접수하기</button><div id="resultBox"></div></div><script src="config.js"></script><script>async function intake(){let p;try{p=JSON.parse(document.getElementById('payload').value)}catch{document.getElementById('resultBox').textContent='QR payload 형식이 올바르지 않습니다.';return}const r=await fetch(`${API_BASE_URL}/presentations/secure/consume`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:p,verifier_id:'hospital_1'})});const d=await r.json();document.getElementById('resultBox').innerHTML=r.ok&&d.result==='pass'?`<div class="result-pass">✅ 접수 완료<br>환자: ${d.worker_name}<br>증상: ${document.getElementById('symptom').value}<br><small>체류자격·신원 Credential 온체인 확인 완료</small></div>`:`<div class="result-fail">❌ ${d.detail||d.reason||'검증 실패'}</div>`}</script></body></html>
