<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>iM Worker Pass - 상품</title>
<link rel="stylesheet" href="ui.css?v=3" />
<script src="i18n.js?v=3"></script>
<style>

  .step { border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; margin-top:10px; background:#fff; }
  .step h4 { margin:0 0 4px; font-size:14px; }
  .step .desc { font-size:12.5px; color:#64748b; }
  .done { border-color:#86efac; background:#f0fdf4; }
  .rows .row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid #eef2f7; font-size:13px; }
  .rows .row span:first-child { color:#475569; white-space:nowrap; }
  .rows .row span:last-child { text-align:right; word-break:break-all; }
  .badge-real { background:#dcfce7; color:#15803d; padding:1px 7px; border-radius:999px; font-size:11px; }
  .badge-mock { background:#f1f5f9; color:#64748b; padding:1px 7px; border-radius:999px; font-size:11px; }
  .muted { font-size:11.5px; color:#94a3b8; margin-top:8px; line-height:1.6; }
  .pop-mask { position:fixed; inset:0; background:rgba(13,27,50,.45); display:flex;
    align-items:flex-end; justify-content:center; z-index:50; padding:16px; }
  .pop { background:#fff; border-radius:var(--radius-card); width:100%; max-width:420px;
    padding:18px 18px 14px; box-shadow:0 -8px 40px rgba(13,27,50,.25);
    max-height:82%; overflow:auto; }
  .pop-kind { display:inline-block; background:#eff6ff; color:#1d4ed8; font-size:11px;
    padding:2px 8px; border-radius:999px; }
  .pop h3 { margin:8px 0 2px; font-size:17px; }
  .pop .lead { font-size:14px; color:#0f172a; font-weight:600; }
  .pop .why { font-size:12px; color:#64748b; margin-top:2px; }
  .pop .rows { margin-top:12px; }
  .pop .rows div { display:flex; justify-content:space-between; gap:10px; padding:6px 0;
    border-bottom:1px solid #eef2f7; font-size:13px; }
  .pop .rows span:first-child { color:#475569; white-space:nowrap; }
  .pop .rows span:last-child { text-align:right; }
  .goal { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; margin-top:12px; }
  .goal .big { font-size:24px; font-weight:700; letter-spacing:-.5px; }
  .goal .sub { font-size:12.5px; color:#64748b; margin-top:2px; }
  .goal input[type=range] { width:100%; margin:10px 0 2px; accent-color:#1a1a1a; padding:0; border:none; }
  .goal .ends { display:flex; justify-content:space-between; font-size:11px; color:#94a3b8; }
  .goal .manual { display:flex; align-items:center; gap:6px; margin-top:10px; }
  .goal .manual input { flex:1; text-align:right; font-size:15px; font-weight:600; padding:8px 10px; }
  .goal .derived { display:flex; justify-content:space-between; gap:10px; padding:8px 0 0;
    font-size:13px; border-top:1px solid #e2e8f0; margin-top:10px; }
  .goal .derived b { font-size:15px; }
  /* 패스포트 홈 — 근태·급여 */
  .pp { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
  .pp .cell { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:11px 13px; }
  .pp .cell .lab { font-size:11.5px; color:#64748b; }
  .pp .cell .val { font-size:20px; font-weight:700; letter-spacing:-.5px; margin-top:3px; }
  .pp .cell .sub { font-size:11.5px; color:#94a3b8; margin-top:2px; }
  .pp .wide { grid-column:1 / -1; }
  .today { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .live { display:inline-block; background:#ecfdf5; color:#047857; font-size:11px;
    padding:2px 7px; border-radius:999px; margin-left:6px; }
  @media (max-width:420px) { .pp { grid-template-columns:1fr; } }
  /* 귀국 목표 적금 */
  .sv { margin-top:14px; border-top:1px solid #eef2f7; padding-top:12px; }
  .sv .hd { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .sv .ttl { font-size:13.5px; font-weight:700; }
  .sv .tag { font-size:11px; padding:2px 8px; border-radius:999px;
    background:#eff6ff; color:#1d4ed8; white-space:nowrap; }
  .sv .bar { height:7px; border-radius:999px; background:#e2e8f0; margin:10px 0 6px; overflow:hidden; }
  .sv .bar i { display:block; height:100%; background:#1d4ed8; border-radius:999px; }
  .sv .ln { display:flex; justify-content:space-between; gap:10px; font-size:12.5px;
    color:#475569; padding:4px 0; }
  .sv .ln b { color:#0f172a; }
  .sv .cta { display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:11px 13px;
    font-size:13px; color:#475569; }
  .sv .cta button { margin:0; width:auto; padding:7px 13px; font-size:12.5px; }
  /* 귀국정산 */
  .rt { margin-top:14px; border-top:1px solid #eef2f7; padding-top:12px; }
  .rt .hd { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .rt .ttl { font-size:13.5px; font-weight:700; }
  .rt .dday { font-size:12px; color:#64748b; }
  .rt .amt { font-size:26px; font-weight:700; letter-spacing:-.6px; margin-top:8px; }
  .rt .sub { font-size:13px; color:#475569; margin-top:2px; }
  .rt .swing { font-size:12px; color:#94a3b8; margin-top:6px; line-height:1.6; }
  .rt .guard { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px;
    background:#ecfdf5; color:#047857; margin-left:6px; }
  .rt .none { font-size:13px; color:#64748b; background:#f8fafc; border:1px solid #e2e8f0;
    border-radius:10px; padding:11px 13px; margin-top:8px; }
  /* 송금·보험 줄과 바로가기 */
  .fxln { margin-top:14px; border-top:1px solid #eef2f7; padding-top:12px; }
  .fxln .ttl { font-size:13.5px; font-weight:700; }
  .fxln .big { font-size:17px; font-weight:700; margin-top:6px; letter-spacing:-.3px; }
  .fxln .sub { font-size:12.5px; color:#64748b; margin-top:3px; line-height:1.6; }
  .fxln .no { font-size:12.5px; color:#94a3b8; margin-top:6px; line-height:1.6; }
  .go { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
  .go a { display:block; text-align:center; text-decoration:none; cursor:pointer;
    background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px;
    padding:11px 6px; color:#0f172a; font-size:12.5px; font-weight:600; }
  .go a:hover { border-color:#0f172a; background:#fff; }
  .go a i { display:block; font-style:normal; font-size:11px; color:#94a3b8;
    font-weight:400; margin-top:2px; }
  @media (max-width:420px) { .go { grid-template-columns:repeat(2,1fr); } }
  /* DC형 퇴직연금 */
  .dc { margin-top:14px; border-top:1px solid #eef2f7; padding-top:12px; }
  .dc .hd { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .dc .ttl { font-size:13.5px; font-weight:700; }
  .dc .yr { font-size:12px; color:#64748b; }
  .dc .bal { font-size:24px; font-weight:700; letter-spacing:-.6px; margin-top:7px; }
  .dc .ln { display:flex; justify-content:space-between; gap:10px; font-size:12.5px;
    color:#475569; padding:4px 0; }
  .dc .ln b { color:#0f172a; }
  .dc .pick { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:11px; }
  .dc .pick button {
    margin:0; width:100%; padding:9px 4px; font-size:12px; font-weight:600; line-height:1.35;
    background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:10px;
  }
  .dc .pick button:hover { border-color:var(--im); background:#f8fafc; }
  .dc .pick button.on { background:var(--im); border-color:var(--im); color:#fff; }
  .dc .pick button i { display:block; font-style:normal; font-size:10.5px; font-weight:400;
    opacity:.75; margin-top:2px; }
  .dc .why { background:#fffbeb; border:1px solid #fcd34d; color:#b45309;
    border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.65; margin-top:10px; }
  .dc .desc { font-size:12px; color:#64748b; line-height:1.65; margin-top:8px; }
  /* 귀국 시점 예상액 — 운용지시를 바꾸면 여기가 움직인다. 현재 잔액은 안 움직인다. */
  .dc .proj { margin-top:11px; background:#f8fafc; border:1px solid #e8edf3;
    border-radius:10px; padding:11px 13px; }
  .dc .proj .lab { font-size:11.5px; color:#64748b; }
  .dc .proj .amt { font-size:19px; font-weight:700; letter-spacing:-.5px; margin-top:3px; }
  .dc .proj .cmp { font-size:12px; color:#475569; margin-top:5px; line-height:1.6; }
  .dc .proj .cmp b { color:#047857; }
  .dc .hint { font-size:11.5px; color:#94a3b8; line-height:1.65; margin-top:8px; }
  .pop .opt { display:flex; align-items:center; gap:8px; font-size:13px; margin-top:8px; }
  .pop .opt input { width:auto; }
  .pop .note { font-size:11.5px; color:#94a3b8; line-height:1.65; margin-top:10px; }
  .pop .engine { font-size:11.5px; color:#475569; line-height:1.65; margin-top:8px;
    background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:9px 11px; }
  .pop .btns { display:flex; gap:8px; margin-top:12px; }
  .pop .btns button { flex:1; margin:0; }
  .err { background:#fdecea; border:1px solid #e74c3c; color:#a92c22; padding:12px; border-radius:10px; margin-top:12px; font-size:13px; }

  .prod-empty { font-size:13px; color:#64748b; line-height:1.75; }
  .sec { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,23,42,.06), 0 1px 8px rgba(15,23,42,.04); }
  .sec > .dc, .sec > .fxln, .sec > .sv, .sec > .rt { margin-top:0; border-top:none; padding-top:0; }
  .sec-no { font-size:12px; font-weight:700; color:var(--im); margin-bottom:10px; letter-spacing:-.2px; }
  .held { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .held span { font-size:11.5px; background:#f1f5f9; color:#475569; border-radius:999px; padding:4px 10px; }
  .held span.none { background:#fff; color:#94a3b8; border:1px dashed #e2e8f0; }
  .stack { margin-top:12px; }
  .stack .ln { display:flex; justify-content:space-between; gap:10px; font-size:12.5px;
    color:#475569; padding:5px 0; }
  .stack .ln b { color:#0f172a; }
  .stack .ln.tot { border-top:1px solid #e2e8f0; margin-top:4px; padding-top:9px; font-size:13.5px; }
  .stack .ln.tot b { font-size:16px; }
  .fxopt { display:flex; align-items:flex-start; gap:9px; margin-top:12px;
    background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:11px 13px;
    font-size:12.5px; line-height:1.6; cursor:pointer; }
  .fxopt input { width:auto; margin-top:2px; flex:none; }
  .fxopt i { display:block; font-style:normal; font-size:11.5px; color:#94a3b8; margin-top:3px; }
  .advice { margin-top:10px; background:#fffbeb; border:1px solid #fcd34d; color:#b45309;
    border-radius:10px; padding:11px 13px; font-size:12.5px; line-height:1.7; }
  .advice.ok { background:#ecfdf5; border-color:#a7f3d0; color:#047857; }
  .advice .hint { display:block; color:#94a3b8; font-size:11px; margin-top:5px; }
  .sec-lead { font-size:12px; color:#94a3b8; line-height:1.7; margin:0 0 14px; }

  /* 데스크톱에서 팝업이 목업 폰 밖으로 번지지 않게 — ui.css 로딩 순서에 기대지 않도록
     이 페이지에도 같은 제약을 둔다. 폰은 max-width 420px, max-height 92vh 중앙 정렬이다. */
  @media (min-width: 900px) {
    .pop-mask {
      left: 50%; right: auto; transform: translateX(-50%);
      width: 420px; top: 4vh; bottom: 4vh;
      border-radius: 34px;
    }
  }
</style>
</head>
<body class="role-phone">
<div class="phone">
  <header class="ph-top">
    <div class="ph-top-bar">
      <span class="ph-brand"><svg class='mark' viewBox='0 0 26 23' fill='none' xmlns='http://www.w3.org/2000/svg' aria-hidden='true'><path d='M3 19.5V8.2c0-1.9 2.4-2.8 3.6-1.3L13 14.8l6.4-7.9C20.6 5.4 23 6.3 23 8.2v11.3' stroke='#00C7A9' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg><span class="nm" data-i18n="app_title">iM PASS</span><span class="role" data-i18n="worker_role">근로자</span></span>
      <span class="acts">
        <div id="langSelectorArea"></div>
        <button type="button" class="bell-btn" data-lock-bell aria-label="알림">
          <svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><path d='M18 8.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5Z'/><path d='M10.3 19a2 2 0 0 0 3.4 0'/></svg>
          <span class="bell-dot" hidden></span>
        </button>
        <a href="home.html" class="switch-link"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true' style='width:13px;height:13px;stroke-width:2.4;'><path d='M4 8.5h13M13.5 5 17 8.5 13.5 12'/><path d='M20 15.5H7M10.5 12 7 15.5 10.5 19'/></svg data-i18n="switch_service">서비스 전환</a>
      </span>
    </div>
    <h1>금융생활</h1>
    <div class="who" id="whoLine">불러오는 중…</div>
  </header>
  <main class="ph-body">
    <p class="sec-lead">
      체류 만료일·급여일·국적처럼 지갑이 이미 아는 값에서 조건이 나옵니다.
      상품을 새로 만드는 것이 아니라 있는 상품을 상황에 맞게 엮습니다.
    </p>
    <div id="prodBox" class="prod-empty">불러오는 중…</div>
  </main>
  <nav class="ph-tabs">
      <a href="wallet.html"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><rect x='2.5' y='5' width='19' height='14' rx='3'/><circle cx='9' cy='11' r='2'/><path d='M6 15.8c.5-1.2 1.7-1.9 3-1.9s2.5.7 3 1.9'/><path d='M15.5 10.2h3.2M15.5 13.6h2.4'/></svg data-i18n="tab_mypass">내 패스</a>
      <a href="submit.html"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 15.5V4'/><path d='m8 7.6 4-3.6 4 3.6'/><path d='M4.5 14v4.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V14'/></svg data-i18n="tab_submit">제출</a>
      <a href="products.html" class="active"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><rect x='2.5' y='5.5' width='19' height='13' rx='3'/><path d='M2.5 10h19'/><path d='M6.5 14.6h3'/></svg>금융생활</a>
  </nav>
</div>

<script src="config.js?v=3"></script>
<script>
    // 새로고침(F5)이면 지갑 상태를 비워 처음부터 시작한다 (wallet.html 과 동일 규칙).
    (function resetOnReload() {
      let nav = null;
      try { nav = performance.getEntriesByType("navigation")[0]; } catch (e) {}
      const reloaded = nav ? nav.type === "reload"
                           : (performance.navigation && performance.navigation.type === 1);
      if (reloaded) {
        try {
          localStorage.removeItem("imwp_credential_id");
          localStorage.removeItem("imwp_pick_worker");
        } catch (e) {}
        location.replace("wallet.html");
      }
    })();

    const CID_STORE = "imwp_credential_id";
    const esc = (v) => String(v == null || v === "" ? "—" : v);
    const won = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";

    let popQueue = [];
    let popAll = [];        // "알아보기"에서 다시 꺼내 쓰기 위해 원본을 들고 있는다
    let currentCid = null;
    let chosen = null;

    function hedgeBlock(h) {
      if (!h) return "";
      if (h.tier === "C") {
        return `
          <div class="fxln">
            <div class="ttl">해외송금 · 환율 보장</div>
            <div class="no">
              지금 송금 규모에서는 보장 비용이 기대 효과보다 커서 권해 드리지 않습니다.
              송금액이 늘면 다시 안내해 드립니다.
            </div>
          </div>`;
      }
      return `
        <div class="fxln">
          <div class="ttl">해외송금 · 환율 보장</div>
          <div class="big">${won(h.monthly_remit)} 송금 시 수수료 ${won(h.fee)}</div>
          <div class="sub">
            ${esc(h.currency_name)}(${esc(h.currency)}) · 다음 송금분의 환율을 지금 고정합니다.
            환율이 불리하게 움직여도 받는 금액이 줄지 않습니다.
          </div>
          <div class="sub" style="color:#94a3b8;">
            최근 6개월 변동폭 ${h.swing_6m_pct}% 기준 예상 절감 ${won(h.expected_saving)} ·
            적용 기간은 다음 급여일 송금 1회분입니다.
          </div>
        </div>`;
    }

    function openHedgeCard() {
      const card = (popAll || []).find(c => c.id === "fx_guaranteed_remittance");
      if (card) { showCard(currentCid, card); return; }
      alert("지금 조건에서는 환율 보장을 권해 드리지 않습니다.");
    }


    // 고용허가제(E-9·H-2)의 퇴직급여는 출국만기보험이다.
    // 보험이라 근로자가 고를 상품이 없다 — 그래서 선택 버튼이 없는 것이 맞다.
    // 이 화면이 하는 일은 얼마가 쌓였고 귀국할 때 언제 어떻게 받는지를 알려 주는 것이다.
    // 법정 퇴직금과의 차액은 **계산하지 않는다**(backend/departure.py 머리말 참조).
    function departureBlock(dp) {
      if (!dp || !dp.applies) return "";
      const yrs = (dp.months / 12).toFixed(1);
      return `
        <div class="dc">
          <div class="hd">
            <span class="ttl">출국만기보험</span>
            <span class="yr">근속 ${dp.months}개월 · ${yrs}년</span>
          </div>
          <div class="bal">${won(dp.balance)}</div>
          <div class="ln"><span>회사가 매달 넣는 금액</span><b>${won(dp.monthly_premium)}</b></div>
          <div class="ln"><span>원금 · 이자</span>
            <b>${won(dp.principal)} · ${won(dp.interest)}</b></div>
          ${dp.projected_balance != null ? `
            <div class="proj">
              <div class="lab">귀국하실 때 받을 금액 (앞으로 ${dp.months_to_leave}개월 더 적립)</div>
              <div class="amt">${won(dp.projected_balance)}</div>
              <div class="cmp">${esc(dp.pay_notice)}</div>
            </div>` : ""}
          ${dp.under_one_year ? `<div class="why">${esc(dp.under_one_year_notice)}</div>` : ""}
          <div class="desc">${esc(dp.basis_notice || "")}</div>
          <div class="hint">${esc(dp.how_notice)}</div>
          <div class="desc" style="color:#94a3b8;">${esc(dp.notice)}</div>
        </div>`;
    }

    function pensionBlock(pn) {
      if (!pn) return "";
      if (!pn.enrolled) {
        return `
          <div class="dc">
            <div class="hd"><span class="ttl">퇴직연금 (DC)</span></div>
            <div class="desc">${esc(pn.reason || "적용 대상이 아닙니다.")}</div>
          </div>`;
      }
      const yrs = (pn.months / 12).toFixed(1);
      const picks = (pn.funds || []).map(f => `

          <div style="font-size:11.5px;color:#94a3b8;line-height:1.65;margin-top:10px;">${esc(card.note)}</div>

    async function enrollSavingsInline(card, host) {

          method: "POST",

            credential_id: currentCid, monthly,
            auto_remit: opt("auto_remit"), fx_guard: opt("fx_guard"),
          }),
        });

      if (!res || !res.ok) { alert("가입 처리에 실패했습니다."); return; }
      alert(`가입되었습니다. 매달 ${monthly.toLocaleString("ko-KR")}원씩 체류 만료일까지 적립됩니다.`);

    // 마스크는 position:fixed 라 화면 기준으로 떠 있다. 폰 목업은 창이 낮으면 화면보다
    // 커져서 페이지가 통째로 스크롤되는데, 그때 폰만 움직이고 마스크는 그대로 있어서
    // 서로 어긋난다. 그래서 resize 뿐 아니라 **스크롤에도** 다시 맞춘다.
    // 스크롤은 body 가 아니라 .phone 안에서 일어날 수도 있으므로 캡처 단계로 받는다.
    function fitToPhone(mask) {
      const phone = document.querySelector(".phone");
      const detach = () => {
        window.removeEventListener("resize", apply);
        window.removeEventListener("scroll", apply, true);
      };
      const apply = () => {
        if (!document.body.contains(mask)) { detach(); return; }
        if (!phone) return;
        const r = phone.getBoundingClientRect();
        const cs = getComputedStyle(phone);
        const bl = parseFloat(cs.borderLeftWidth) || 0;
        const bt = parseFloat(cs.borderTopWidth) || 0;
        const rad = parseFloat(cs.borderRadius) || 0;
        // 여기서 좌표를 직접 잡으므로, CSS 미디어쿼리가 걸어 둔 translateX(-50%)를
        // 반드시 꺼야 한다. 안 끄면 창이 900px를 넘는 순간 마스크가 폭의 절반만큼
        // 왼쪽으로 밀려 폰 목업 밖으로 빠져나간다.
        mask.style.transform = "none";
        mask.style.left = (r.left + bl) + "px";
        mask.style.top = (r.top + bt) + "px";
        mask.style.width = phone.clientWidth + "px";
        mask.style.height = phone.clientHeight + "px";
        mask.style.right = "auto";
        mask.style.bottom = "auto";
        mask.style.borderRadius = Math.max(0, rad - bl) + "px";
      };
      apply();
      window.addEventListener("resize", apply);
      window.addEventListener("scroll", apply, { capture: true, passive: true });
    }

    function showNextCard(cid) {
      const card = popQueue.shift();
      if (!card) return;
      showCard(cid, card);
    }

    function showCard(cid, card) {
      const mask = document.createElement("div");
      mask.className = "pop-mask";
      mask.innerHTML = `

          <span class="pop-kind" style="${card.tier === "C"

          <h3>${esc(card.title)}</h3>
          <div class="lead">${esc(card.lead)}</div>
          <div class="why">${esc(card.why)}</div>
          <div class="rows">

          </div>
          ${card.calc ? `
            <div class="goal">
              <div style="font-size:12.5px;color:#475569;">귀국하실 때 받을 금액</div>
              <div class="big" id="goalAmt"></div>
              <div class="sub">끌어서 맞추거나 아래에 직접 입력하세요</div>

                     step="${card.calc.target_step}" value="${card.calc.target_default}" />
              <div class="ends">
                <span>${(card.calc.target_min / 10000).toLocaleString("ko-KR")}만</span>
                <span>${(card.calc.target_max / 10000).toLocaleString("ko-KR")}만</span>

              <div class="manual">
                <input type="number" id="goalInput" step="${card.calc.target_step}"

              <div class="derived">
                <span>매달 넣는 금액</span><b id="goalMonthly"></b>
              </div>
              <div class="derived" style="border:none;padding-top:4px;">
                <span style="color:#64748b;font-size:12px;">${card.calc.months}개월 × 매달 납입 + 이자</span>
                <span id="goalReal" style="color:#64748b;font-size:12px;"></span>
              </div>
            </div>` : ""}
          ${(card.options || []).map(o => `
            <label class="opt"><input type="checkbox" data-opt="${esc(o.id)}" checked /> ${esc(o.label)}</label>`).join("")}
          ${card.detail ? `
            <details style="margin-top:10px;">
              <summary style="cursor:pointer;font-size:12.5px;color:#2563eb;">왜 그런가요?</summary>
              <div style="font-size:12.5px;color:#475569;line-height:1.7;margin-top:6px;">
                ${esc(card.detail)}
              </div>
              <div class="engine">${esc(card.engine)}</div>
            </details>` : `<div class="engine">${esc(card.engine)}</div>`}
          <div class="note">${esc(card.note)}</div>
          <div class="btns">
            <button data-act="cta">${esc(card.cta)}</button>
            <button class="secondary" data-act="later">나중에</button>
          </div>
        </div>`;
      // 폰 목업 안에만 띄운다. body 에 그대로 붙이면 프레임 밖으로 삐져나온다.
      document.body.appendChild(mask);
      fitToPhone(mask);

      // 목표 금액 ↔ 월 납입 역산. 슬라이더와 입력칸이 서로를 따라간다.
      chosen = card.calc ? card.calc.target_default : null;
      if (card.calc) {
        const k = card.calc;
        const range = mask.querySelector("#goalRange");
        const input = mask.querySelector("#goalInput");
        const amt = mask.querySelector("#goalAmt");
        const mon = mask.querySelector("#goalMonthly");
        const real = mask.querySelector("#goalReal");
        const clamp = (v) => Math.min(k.target_max, Math.max(k.target_min, v));

        const paint = (target, syncInput = true) => {
          target = clamp(Math.round(target / k.target_step) * k.target_step);
          // 목표 → 월 납입(만원 단위 반올림) → 그 납입으로 실제 도달하는 금액
          let monthly = Math.round(target / (k.months * k.factor) / k.monthly_step) * k.monthly_step;
          monthly = Math.min(k.monthly_max, Math.max(k.monthly_min, monthly));
          const achieved = Math.round(monthly * k.months * k.factor);
          chosen = { target, monthly, achieved };

    // 상품 화면의 본체 — 네 구획.

    //   ④ 매달 해외송금 (지금 보내는 돈)
    // 귀국정산은 따로 두지 않는다 — ①이 이미 "귀국할 때 얼마"를 다룬다.
    let snapshot = null;

    // ── ① 지금 들고 있는 것 + 매달 송금액 ──────────────────────
    // 근로자가 실제로 하는 결정은 "이번 달에 집에 얼마를 보낼까"다.
    // 그 금액이 정해지면 환율 보장 수수료·등급 판정(④)이 바로 따라오고,
    // 남는 돈에서 적금(③)을 얼마나 넣을지가 나온다.
    let fxTimer = null;

    function paintGoal(p) {
      const host = document.getElementById("secGoal");
      const pn = p.pension || {};
      const sv = p.savings || {};
      const wage = (p.month && p.month.available) ? p.month.estimated_gross_pay : null;
      const start = (p.hedge && p.hedge.monthly_remit) || 500000;
      const maxRemit = Math.max(1000000, Math.round((wage || 1000000) / 100000) * 100000);

      const dp = p.departure || {};
      const held = [
        dp.applies ? "출국만기보험" : null,
        pn.enrolled ? `퇴직연금 ${pn.fund ? pn.fund.name : "운용 미선택"}` : null,
        sv.enrolled ? `적금 월 ${won(sv.monthly)}` : null,
        p.insurance ? `보험 ${p.insurance.product}` : null,
        (sv.enrolled && sv.fx_guard) ? "환율 보장" : null,
      ].filter(Boolean);

      host.innerHTML = `
        <div class="sec-no">① 달마다 얼마를 송금하시겠어요?</div>
        <div class="held">${held.length
          ? held.map(h => `<span>${esc(h)}</span>`).join("")
          : `<span class="none">아직 가입한 상품이 없습니다</span>`}</div>

        <div class="goal">
          <div style="font-size:12.5px;color:#475569;">매달 본국으로 보낼 금액</div>
          <div class="big" id="gAmt"></div>
          <div class="sub" id="gHome">끌어서 맞추거나 아래에 직접 입력하세요</div>
          <input type="range" id="gRange" min="100000" max="${maxRemit}" step="50000" value="${start}" />
          <div class="ends">
            <span>10만</span><span>${(maxRemit / 10000).toLocaleString("ko-KR")}만</span>
          </div>
          <div class="manual">
            <input type="number" id="gInput" step="50000" min="100000" max="${maxRemit}" />
            <span style="font-size:13px;color:#475569;">원</span>
          </div>
        </div>

        <label class="fxopt" id="fxOptWrap">
          <input type="checkbox" id="fxGuard" checked />
          <span>
            <b>환율 보장</b> 적용 — 다음 송금분의 환율을 지금 고정합니다
            <i id="fxFeeHint">수수료 —</i>
          </span>
        </label>

        <div class="stack">
          ${wage ? `<div class="ln"><span>이번 달 예상 급여 (어림값)</span><b>${won(wage)}</b></div>` : ""}
          <div class="ln"><span>본국 송금</span><b id="gSend">—</b></div>
          <div class="ln" id="gFeeLine"><span>환율 보장 수수료</span><b id="gFee">—</b></div>
          <div class="ln tot"><span>한국에서 쓰고 남는 돈</span><b id="gLeft">—</b></div>
          <div class="hint" style="margin-top:8px;">
            주휴수당과 4대보험·세금 공제를 넣지 않은 어림값이에요.
            실제 금액은 회사 급여명세를 확인해 주세요.
          </div>
        </div>
        <div id="gAdvice" class="advice"></div>`;

      const range = host.querySelector("#gRange");
      const input = host.querySelector("#gInput");
      const amt = host.querySelector("#gAmt");
      const home = host.querySelector("#gHome");
      const send = host.querySelector("#gSend");
      const left = host.querySelector("#gLeft");
      const adv = host.querySelector("#gAdvice");
      const guard = host.querySelector("#fxGuard");
      const feeEl = host.querySelector("#gFee");
      const feeLine = host.querySelector("#gFeeLine");
      const feeHint = host.querySelector("#fxFeeHint");
      const optWrap = host.querySelector("#fxOptWrap");
      const clamp = (v) => Math.min(maxRemit, Math.max(100000, v));

      // 체크 상태와 수수료를 반영해 "남는 돈"을 다시 쓴다.
      // 환율 보장을 켜면 수수료가 이번 달 지출에 더해진다 — 그걸 숨기지 않는다.
      let lastFee = 0, lastTier = null, lastRemit = 0;
      const paintLeft = () => {
        const on = guard.checked && lastTier && lastTier !== "C";
        const fee = on ? lastFee : 0;
        feeEl.textContent = on ? "− " + won(fee) : "적용 안 함";
        feeLine.style.opacity = on ? "1" : ".5";
        left.textContent = wage ? won(Math.max(wage - lastRemit - fee, 0)) : "—";
      };
      guard.addEventListener("change", paintLeft);

      const paint = (v, syncInput = true) => {
        v = clamp(Math.round(v / 50000) * 50000);
        amt.textContent = `${v.toLocaleString("ko-KR")}원`;
        range.value = v;
        if (syncInput) input.value = v;
        send.textContent = won(v);
        lastRemit = v;
        paintLeft();

        const h = p.hedge;
        if (h && h.unit_per_krw) {
          const local = Math.round(v * h.unit_per_krw);
          home.textContent = `${h.currency_name} 약 ${local.toLocaleString("ko-KR")} ${h.currency}`;
        }
        quoteFx(v, adv, wage, (h) => {
          lastFee = h ? h.fee : 0;
          lastTier = h ? h.tier : null;
          if (h && h.tier !== "C") {
            feeHint.textContent = `수수료 ${won(h.fee)} · 예상 절감 ${won(h.expected_saving)}`;
            optWrap.style.display = "flex";
          } else {
            optWrap.style.display = "none";   // 권하지 않는 구간에서는 선택지를 내리지 않는다
          }
          paintLeft();
        });
      };

      range.addEventListener("input", () => paint(Number(range.value)));
      input.addEventListener("input", () => {
        const v = Number(input.value);
        if (!isNaN(v) && v > 0) paint(v, false);
      });
      input.addEventListener("blur", () => paint(Number(input.value) || start));
      paint(start);
    }

    // 금액이 바뀔 때마다 서버에 다시 물어 등급·수수료를 받는다.
    // 등급 C(권하지 않음)가 나오는 구간이 있다는 것이 이 화면의 논지다.
    function quoteFx(monthly, adv, wage, onQuote) {
      clearTimeout(fxTimer);
      fxTimer = setTimeout(async () => {
        let h = null;
        try {
          const res = await fetch(`${API_BASE_URL}/fx/quote/${currentCid}?monthly=${monthly}`);
          if (res.ok) h = (await res.json()).hedge;
        } catch (e) {}
        if (onQuote) onQuote(h);
        if (!h) { adv.className = "advice"; adv.innerHTML = "환율 조건을 불러오지 못했습니다."; return; }

        // ④ 해외송금 구획도 같은 금액으로 다시 그린다
        const sec = document.getElementById("secFx");
        if (sec) sec.innerHTML = `<div class="sec-no">④ 지금 보내는 돈</div>${hedgeBlock(h)}`;

        if (h.tier === "C") {
          adv.className = "advice";
          adv.innerHTML = `이 금액에서는 <b>환율 보장을 권해 드리지 않습니다.</b>
            아껴지는 금액보다 수수료가 크기 때문입니다.
            <span class="hint">송금액이 늘면 자동으로 다시 안내합니다.</span>`;
          return;
        }
        const net = h.expected_saving - h.fee;
        adv.className = net > 0 ? "advice ok" : "advice";
        adv.innerHTML = `환율 보장 수수료 <b>${won(h.fee)}</b> ·
          최근 6개월 변동폭 기준 예상 절감 <b>${won(h.expected_saving)}</b>
          ${net > 0 ? `(순이득 <b>${won(net)}</b>)` : ""}
          ${wage ? `<span class="hint">남는 돈으로 ③ 적금을 채우면 귀국할 때 목돈이 됩니다.</span>` : ""}`;
      }, 180);
    }

    (function boot() {
      let cid = null;
      try { cid = localStorage.getItem(CID_STORE); } catch (e) {}
      if (!cid) { location.replace("wallet.html"); return; }
      loadRecommendations(cid).then(() => loadProducts(cid));
    })();
</script>
<script>
  // 언어 선택기는 i18n.js가 그린다. setLang()이 translatePage()를 자동 호출하므로
  // data-i18n 이 없는 문구도 번역된다. 개인정보에는 data-no-translate 를 붙여 둔다.
  // i18n.js 가 없거나 못 뜨더라도 화면은 그대로 동작해야 한다.
  if (window.I18N) {
    I18N.renderSelector("langSelectorArea");
    window.addEventListener("imwp-lang-change", () => I18N.apply());
  }
</script>
</body>
</html>
