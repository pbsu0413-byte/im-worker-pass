<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iM Worker Pass - 은행 콘솔</title>
<link rel="stylesheet" href="ui.css" />
<style>
  .kpi { display:flex; gap:8px; margin-top:10px; }
  .kpi div { flex:1; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px; text-align:center; }
  .kpi b { display:block; font-size:19px; }
  .kpi span { font-size:11.5px; color:#64748b; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid #eef2f7; font-size:12.5px; }
  .muted { font-size:11.5px; color:#94a3b8; margin-top:10px; line-height:1.6; }
  .box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; margin-top:12px; }
</style>
</head>
<body class="role-console">
  <div class="cs-top-bar">
    <span class="wm">iM PASS<span class="role">은행·기관</span></span>
    <a href="home.html" class="btn-switch-service"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true' style='width:13px;height:13px;stroke-width:2.4;'><path d='M4 8.5h13M13.5 5 17 8.5 13.5 12'/><path d='M20 15.5H7M10.5 12 7 15.5 10.5 19'/></svg>서비스 전환</a>
  </div>

  <div class="cs-shell">
    <aside class="cs-side">
      <div class="nav-grp">업무</div>
      <a href="bank.html" class="on"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><rect x='3' y='3' width='7.5' height='8.5' rx='2'/><rect x='13.5' y='3' width='7.5' height='5.5' rx='2'/><rect x='13.5' y='11' width='7.5' height='10' rx='2'/><rect x='3' y='14' width='7.5' height='7' rx='2'/></svg>기업·외환 현황</a>
      <a href="admin.html"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3.2 19 6v6.2c0 4-2.8 7.6-7 8.6-4.2-1-7-4.6-7-8.6V6l7-2.8Z'/><path d='m9 12.2 2.2 2.2 4-4.2'/></svg>자격 상태 관리</a>
      <a href="insurer.html"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3.2 19 6v6.2c0 4-2.8 7.6-7 8.6-4.2-1-7-4.6-7-8.6V6l7-2.8Z'/><path d='M12 9.3v5.4M9.3 12h5.4'/></svg>보험 접수함</a>
      <div class="nav-grp">자격 관리</div>
      <span class="soon"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 3.5h8l4.5 4.5v12a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 6 3.5Z'/><path d='M13.5 3.8V8.5H18'/><path d='M8.5 14.5h7M8.5 17.5h4.5'/></svg>자격 발급<span class="badge">Phase 2</span></span>
      <span class="soon"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>자격 조회<span class="badge">Phase 2</span></span>
      <div class="nav-grp">운영</div>
      <span class="soon"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M3.5 20.5h17M5.5 20.5V9.5M18.5 20.5V9.5M12 3.5l7 5.5H5l7-5.5Z'/><path d='M9 13h1.5M13.5 13H15M9 16.5h1.5M13.5 16.5H15'/></svg>기관 관리<span class="badge">Phase 2</span></span>
      <span class="soon"><svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M4.5 6.5h15M4.5 12h15M4.5 17.5h10'/></svg>처리 내역<span class="badge">Phase 2</span></span>
    </aside>
    <div class="cs-main">
  <div class="cs-head">
    <span class="mark">iM</span>
    <h1>계약기업 / 환율보장보험 규모 분석</h1>
    <span class="sub">iM뱅크 기업영업본부</span>
  </div>

  <div class="cs-wrap">
  <p class="tx-caption" style="margin:0 0 16px;max-width:760px;">
    영업담당자가 보는 화면이에요. 신규등록 시연용 A/B 기업은 제외하고,
    이미 은행과 계약된 대구·경북 사업장의 환율보장보험 규모만 집계해서 보여드려요.
  </p>

  <div class="card">
    <label>계약 사업장</label>
    <select id="siteSel" onchange="load()"></select>
    <div id="box"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const esc = (v) => String(v == null || v === "" ? "—" : v);
    const won = (v) => `${Math.round(v).toLocaleString("ko-KR")}원`;
    const eok = (v) => v >= 100000000
      ? `${(v / 100000000).toFixed(1)}억원` : `${Math.round(v / 10000).toLocaleString("ko-KR")}만원`;

    async function loadList() {
      const res = await fetch(`${API_BASE_URL}/employer/sites`);
      if (!res.ok) return;
      const sites = (await res.json()).sites || [];
      document.getElementById("siteSel").innerHTML = sites.map(s =>
        `<option value="${s.site_id}">${esc(s.site_name)} · ${esc(s.location)} · 외국인 ${s.foreign_employees}명</option>`
      ).join("");
      load();
    }

    async function load() {
      const id = document.getElementById("siteSel").value;
      if (!id) return;
      const res = await fetch(`${API_BASE_URL}/employer/${id}/bank`);
      if (!res.ok) return;
      const d = await res.json();
      const s = d.site, r = d.remit;
      const g = d.fx_guard || {
        covered_people: r.hedge_people,
        coverage_monthly: r.total_monthly,
        coverage_annual: r.total_monthly * 12,
        premium_rate_pct: 0.8,
        premium_monthly: r.total_monthly * 0.008,
        premium_annual: r.total_monthly * 12 * 0.008,
        covered_ratio_pct: 100,
      };

      const tierRow = (name, t, color, desc) => !t || !t.people ? "" : `
        <div style="padding:8px 0;border-bottom:1px solid #eef2f7;">
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span><b style="color:${color};">등급 ${esc(name)}</b> · ${t.people}명</span>
            <span style="color:#64748b;">${eok(t.amount)} / 월</span>
          </div>
          <div style="font-size:11.5px;color:#94a3b8;margin-top:2px;">${esc(desc)}</div>
          <div style="font-size:11.5px;color:#64748b;">${esc(t.nationalities.join(" · "))}</div>
        </div>`;

      document.getElementById("box").innerHTML = `
        <div class="kpi" style="margin-top:12px;">
          <div><b>${s.foreign_employees}</b><span>계약기업 근로자</span></div>
          <div><b>${s.im_payroll_accounts}</b><span>연결 급여계좌</span></div>
          <div><b>${eok(g.coverage_monthly)}</b><span>월 보장규모</span></div>
          <div><b>${eok(g.premium_annual)}</b><span>연 보험료 추정</span></div>
        </div>

        <div class="box">
          <div style="font-weight:600;font-size:13px;">환율보장보험 규모 (매월 ${s.payday}일 급여)</div>
          <div style="font-size:12px;color:#64748b;margin-bottom:4px;">
            계약기업 근로자 ${g.covered_people}명 기준 월 ${eok(g.coverage_monthly)}, 연 ${eok(g.coverage_annual)} 보장대상입니다.
            예상 보험료율 ${g.premium_rate_pct}% 적용 시 월 ${won(g.premium_monthly)}, 연 ${won(g.premium_annual)} 규모로 잡힙니다.
            신규등록 중인 A/B 기업은 이 집계에서 제외했습니다.
          </div>
          ${tierRow("A", d.tiers.A, "#15803d", "자국통화가 달러에 연동 — 원화·달러 구간 보장 중심")}
          ${tierRow("B", d.tiers.B, "#b45309", "자국통화가 따로 움직임 — 원화·자국통화 직접 보장 필요")}
        </div>

        <div style="margin-top:14px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:4px;">통화별 보장 대상액</div>
          ${r.currencies.map(c => `
            <div class="row">
              <span>${esc(c.name)} (${esc(c.currency)}) · 등급 ${esc(c.tier)}</span>
              <span style="color:#64748b;">${c.people}명 · ${eok(c.amount)}</span>
            </div>`).join("")}
        </div>

        <div class="box">
          <div style="font-weight:600;font-size:13px;">미가입 ${d.pipeline.payroll_gap}명</div>
          <div style="font-size:12px;color:#64748b;">
            계약기업 근로자 중 급여계좌가 아직 연결되지 않은 인원입니다. 전환 시 월 ${eok(d.pipeline.gap_amount)}이 추가 보장·송금 후보가 됩니다.
          </div>
        </div>

        <div class="box">
          <div style="font-weight:600;font-size:13px;margin-bottom:4px;">은행이 볼 영업 포인트</div>
          ${d.expansion.map(e => `
            <div class="row"><span>${esc(e.name)}</span><span style="color:#64748b;">${esc(e.value)}</span></div>
          `).join("")}
          <div style="font-size:11.5px;color:#64748b;margin-top:8px;line-height:1.6;">
            근로자 복지로 들어가 급여이체를 받고, 거기서 기업계좌·외환·운전자금으로 이어집니다.
            이 화면은 신규등록 흐름이 아니라 이미 계약된 기업의 보장보험·송금·외환 규모를 보는 자리입니다.
          </div>
        </div>

        <div class="box">
          <div style="font-weight:600;font-size:13px;margin-bottom:4px;">제안할 때 쓸 문구</div>
          ${d.pitch.map(p => `
            <div style="font-size:12.5px;color:#334155;padding:5px 0;border-bottom:1px solid #eef2f7;">
              · ${esc(p)}
            </div>`).join("")}
          <div style="font-size:11.5px;color:#94a3b8;margin-top:8px;line-height:1.6;">
            회사가 얻는 것은 대시보드가 아니라 일이 줄어드는 것입니다. 지금 인사담당자가 하는
            금융 민원 창구 노릇이 근로자 앱으로 넘어갑니다.
          </div>
        </div>

        <div class="muted">${esc(d.note)}</div>`;
    }

    loadList();
  </script>
  </div>
  </div></div>
  <div class="rolebar"><a href="home.html"><svg class='ico ico-sm' viewBox='0 0 24 24' aria-hidden='true'><path d='m15 18-6-6 6-6'/></svg>서비스 선택으로</a></div>
</body>
</html>
