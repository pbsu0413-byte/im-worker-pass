<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#555"/></marker>
    <style>
      .k{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#222}
      .title{font-size:38px;font-weight:900}.sub{font-size:19px;fill:#555}
      .box{fill:#fff;stroke:#555;stroke-width:3}.dark{fill:#333;stroke:#222;stroke-width:3}.light{fill:#f8f8f8;stroke:#555;stroke-width:3}
      .bt{font-size:19px;font-weight:900}.tx{font-size:15px;fill:#444}.sm{font-size:13px;fill:#666}
      .lane{font-size:20px;font-weight:900}.label{font-size:14px;fill:#555;font-weight:700}
