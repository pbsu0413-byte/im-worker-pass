    <text x="210" y="225">P0 문제정의</text><text x="490" y="225">P1 기관/데이터 모델</text><text x="840" y="225">P2 지갑 발급</text><text x="1150" y="225">P3 선택공개 QR</text><text x="1480" y="225">P4 검증/운영</text><text x="1800" y="225">P5 금융 확장</text><text x="2110" y="225">P6 테스트/배포</text>
