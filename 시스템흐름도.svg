  <text x="72" y="94" class="k sub">검정 박스와 연결선을 기준으로 표현한 전체 사용자 여정 · API 처리 · 기관 조회 · 블록체인 상태 흐름</text>

  <!-- main spine -->
  <rect x="80" y="135" width="190" height="64" rx="8" class="dark"/><text x="175" y="174" text-anchor="middle" class="k" style="fill:#fff;font-size:20px;font-weight:900">서비스 시작</text>
  <path d="M270 167 H335" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="350" y="135" width="230" height="64" rx="8" class="box"/><text x="465" y="163" text-anchor="middle" class="k bt">런처</text><text x="465" y="185" text-anchor="middle" class="k tx">home.html · 언어 선택</text>
  <path d="M580 167 H645" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="660" y="135" width="270" height="64" rx="8" class="box"/><text x="795" y="163" text-anchor="middle" class="k bt">사용자 역할 선택</text><text x="795" y="185" text-anchor="middle" class="k tx">근로자 / 사업자 / 은행·기관</text>
  <path d="M930 167 H995" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1010" y="135" width="290" height="64" rx="8" class="dark"/><text x="1155" y="163" text-anchor="middle" class="k" style="fill:#fff;font-size:19px;font-weight:900">FastAPI 진입</text><text x="1155" y="185" text-anchor="middle" class="k" style="fill:#ddd;font-size:14px">main.py · Uvicorn :8000</text>

  <!-- phase line -->
  <path d="M80 235 H2320" stroke="#888" stroke-width="2"/>
  <text x="80" y="225" class="k label">구현 단계</text>
