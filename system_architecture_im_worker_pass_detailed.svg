  <rect x="670" y="915" width="1255" height="245" rx="14" fill="#f8fafb" stroke="#c4d3d7" stroke-width="2"/><text x="700" y="952" class="kr cardTitle">D. 검증 이후 도메인 서비스 fan-out</text>
  <rect x="700" y="980" width="230" height="135" rx="12" fill="#eef7ff" stroke="#a6cceb"/><text x="815" y="1013" text-anchor="middle" class="kr cardTitle">근태·급여</text><text x="720" y="1045" class="kr txt">attendance.py</text><text x="720" y="1071" class="kr txt">payroll.py</text><text x="720" y="1097" class="kr tiny">출근/퇴근 → 월 예상급여</text>
