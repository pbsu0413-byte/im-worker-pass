  <rect x="2035" y="525" width="840" height="170" rx="14" fill="#fff8ef" stroke="#f2c288" stroke-width="2"/><text x="2065" y="562" class="kr cardTitle">① 발급기관 원천 데이터 / 목적별 coverage</text><text x="2065" y="595" class="kr txt">출입국·외국인청: 체류자격/신원 (필수)   ·   고용센터: 고용이력/사업장</text><text x="2065" y="623" class="kr txt">iM뱅크: 급여계좌 실명확인 (REAL)   ·   의료기관: 건강진단 유효기간</text><text x="2065" y="651" class="kr txt">HRD Korea · Q-Net · KOSHA · NIIED: 교육/자격/안전/한국어</text><text x="2065" y="679" class="kr tiny">employer=8곳 · insurance=3곳 · hospital=2곳으로 조회 범위가 달라짐</text>
