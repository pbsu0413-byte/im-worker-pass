  <rect x="120" y="930" width="445" height="120" rx="14" fill="#eef7ff" stroke="#9fc7eb" stroke-width="2"/><text x="145" y="965" class="kr cardTitle">사업자 현장</text><text x="145" y="995" class="kr txt">scan.html에서 payload 입력/스캔</text><text x="145" y="1023" class="kr txt">attendance.html에서 출퇴근 토글</text>
  <path d="M342 1050 V1095" stroke="#00a995" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <rect x="120" y="1105" width="445" height="175" rx="14" fill="#fff5e9" stroke="#f2c288" stroke-width="2"/><text x="145" y="1140" class="kr cardTitle">은행·기관 운영 화면</text><text x="145" y="1170" class="kr txt">wallet.html · admin.html · bank.html</text><text x="145" y="1197" class="kr txt">발급/철회/복구 · 기관별 대시보드</text><text x="145" y="1224" class="kr txt">insurer.html 보험 접수함</text><text x="145" y="1254" class="kr tiny">시연용 관리자 조작이 온체인 상태에 반영</text>
  <rect x="120" y="1320" width="445" height="125" rx="14" fill="#f7fafb" stroke="#c4d3d7"/><text x="145" y="1355" class="kr cardTitle">공통 UI 규칙</text><text x="145" y="1385" class="kr txt">ui.css · config.js · i18n.js</text><text x="145" y="1413" class="kr txt">data-no-translate로 이름/계좌/payload 보호</text>

  <!-- center: API and domain flows -->
  <rect x="670" y="525" width="1255" height="100" rx="14" fill="#e9f3fb" stroke="#9ec8ea" stroke-width="2"/><text x="700" y="560" class="kr cardTitle">FastAPI / Uvicorn 진입점</text><text x="700" y="590" class="kr api">/health  /agencies  /wallet/*  /credentials  /presentations/*  /verify</text><text x="700" y="614" class="kr api">/attendance/*  /passport/*  /insurance/*  /admin/*  /api/translate</text>

  <!-- branch 1 issue -->
  <rect x="670" y="655" width="380" height="230" rx="14" fill="#f2fbfa" stroke="#80cfc4" stroke-width="2"/><text x="700" y="692" class="kr cardTitle">A. 지갑 발급 파이프라인</text><text x="700" y="724" class="kr txt">1) POST /wallet/bank-verify</text><text x="700" y="750" class="kr txt">2) POST /wallet/register</text><text x="700" y="776" class="kr txt">3) 출입국 필수 조회</text><text x="700" y="802" class="kr txt">4) 나머지 기관 병렬 조회</text><text x="700" y="828" class="kr txt">5) POST /credentials → issue()</text><text x="700" y="860" class="kr tiny">말소/기록 없음 → 발급 중단 또는 빈칸 진행</text>
  <!-- branch 2 presentation -->
  <rect x="1070" y="655" width="380" height="230" rx="14" fill="#f2f8ff" stroke="#9fc8ec" stroke-width="2"/><text x="1100" y="692" class="kr cardTitle">B. 선택공개 제출</text><text x="1100" y="724" class="kr txt">1) 목적 선택: employer/hospital/...</text><text x="1100" y="750" class="kr txt">2) agency_api 재조회</text><text x="1100" y="776" class="kr txt">3) payload 최소화</text><text x="1100" y="802" class="kr txt">4) 단말 개인키 ECDSA 서명</text><text x="1100" y="828" class="kr txt">5) 60초 QR 발행</text><text x="1100" y="860" class="kr tiny">POST /presentations/secure</text>
  <!-- branch 3 verify -->
  <rect x="1470" y="655" width="455" height="230" rx="14" fill="#fff8ef" stroke="#f2c288" stroke-width="2"/><text x="1500" y="692" class="kr cardTitle">C. 수령처 검증 / 오류 분기</text><text x="1500" y="724" class="kr txt">서명 복호화 → payload 위변조 검사</text><text x="1500" y="750" class="kr txt">target 일치 → QR 만료(60초) 검사</text><text x="1500" y="776" class="kr txt">blockchain getStatus() 조회</text><text x="1500" y="802" class="kr txt">통과: ACCEPT · 실패: REJECT</text><text x="1500" y="838" class="kr tiny">SIGNATURE_INVALID · TARGET_MISMATCH</text><text x="1500" y="861" class="kr tiny">REVOKED · EXPIRED</text>
