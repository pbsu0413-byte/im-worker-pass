  <rect x="635" y="440" width="1325" height="55" rx="14" fill="#2776a6"/><text x="1297" y="476" text-anchor="middle" class="kr lane">애플리케이션·API·도메인 로직</text>
  <rect x="2000" y="440" width="910" height="55" rx="14" fill="#e48338"/><text x="2455" y="476" text-anchor="middle" class="kr lane">기관 데이터·저장소·블록체인</text>

  <!-- left: screen/user flow -->
  <rect x="120" y="525" width="445" height="120" rx="14" fill="#e8fbf7" stroke="#86d8cd" stroke-width="2"/><text x="145" y="560" class="kr cardTitle">런처 / 사용자 선택</text><text x="145" y="590" class="kr txt">home.html → 근로자 · 사업자 · 은행/기관</text><text x="145" y="618" class="kr tiny">다국어 선택기 · 역할별 화면 진입</text>
  <path d="M342 645 V690" stroke="#00a995" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <rect x="120" y="700" width="445" height="175" rx="14" fill="#f1fbff" stroke="#a6d0ec" stroke-width="2"/><text x="145" y="735" class="kr cardTitle">근로자 앱 (모바일 목업)</text><text x="145" y="765" class="kr txt">people.html → wallet.html</text><text x="145" y="792" class="kr txt">submit.html → products.html</text><text x="145" y="819" class="kr txt">insurance.html · 잠금화면 알림</text><text x="145" y="849" class="kr tiny">발급/제출/금융생활을 한 여정으로 연결</text>
