<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1800" viewBox="0 0 3000 1800">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdfd"/><stop offset="1" stop-color="#eef6f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#234c55" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#65797e"/></marker>
    <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#00a995"/></marker>
    <style>
      .kr{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#17383f}
      .title{font-size:46px;font-weight:900;letter-spacing:-1.2px}.sub{font-size:23px;fill:#587076}
      .h{font-size:24px;font-weight:900}.lane{font-size:23px;font-weight:900;fill:#fff}
      .cardTitle{font-size:21px;font-weight:900}.txt{font-size:17px;fill:#526970}.tiny{font-size:15px;fill:#677a80}
      .phase{font-size:17px;font-weight:800;fill:#fff}.phaseTxt{font-size:16px;fill:#35545c}.flow{font-size:18px;font-weight:800}
      .api{font-size:15px;fill:#356173;font-family:Consolas,'Courier New',monospace}
    </style>
  </defs>
  <rect width="3000" height="1800" fill="url(#paper)"/>
  <circle cx="2820" cy="120" r="180" fill="#d9f4ef" opacity=".75"/><circle cx="160" cy="1670" r="220" fill="#e4f7f5" opacity=".8"/>

  <text x="90" y="80" class="kr title">iM PASS · 구현 진행 및 시스템 구조도</text>
  <text x="92" y="120" class="kr sub">외국인 근로자의 자격 발급부터 제출 검증, 근태·금융 서비스, 운영·테스트까지의 실제 구현 흐름</text>
  <rect x="2500" y="46" width="360" height="54" rx="27" fill="#00ae9b"/><text x="2680" y="82" text-anchor="middle" class="kr" style="font-size:19px;font-weight:900;fill:#fff">DETAILED SYSTEM MAP · 2026</text>

  <!-- 0. implementation roadmap -->
  <rect x="90" y="155" width="2820" height="245" rx="20" fill="#173f48" filter="url(#shadow)"/>
  <text x="125" y="198" class="kr" style="font-size:25px;font-weight:900;fill:#a6eee4">구현 진행 단계 (Roadmap)</text>
  <text x="125" y="228" class="kr" style="font-size:16px;fill:#c5d9db">각 단계의 산출물이 다음 단계의 입력으로 이어지며, 시연 시나리오는 P2~P6를 순서대로 재생한다.</text>

  <g transform="translate(125 255)">
    <rect width="330" height="105" rx="13" fill="#276a72"/><text x="18" y="30" class="kr phase">P0 · 문제 정의 / 범위</text><text x="18" y="59" class="kr" style="font-size:16px;fill:#e6fbf8">기관별 분산 서류 문제 정의</text><text x="18" y="84" class="kr" style="font-size:15px;fill:#b6d5d5">B2B2C · 최소공개 · 은행 접점</text>
    <path d="M345 52 H385" stroke="#7cbec0" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="410" width="330" height="105" rx="13" fill="#276a72"/><text x="428" y="30" class="kr phase">P1 · 데이터/기관 모델</text><text x="428" y="59" class="kr" style="font-size:16px;fill:#e6fbf8">8개 기관 + 14개 seed 설계</text><text x="428" y="84" class="kr" style="font-size:15px;fill:#b6d5d5">목적별 조회 coverage 규칙</text>
    <path d="M755 52 H795" stroke="#7cbec0" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="820" width="330" height="105" rx="13" fill="#008f87"/><text x="838" y="30" class="kr phase">P2 · 지갑 발급</text><text x="838" y="59" class="kr" style="font-size:16px;fill:#fff">KYC → 단말키 → 체류자격 확인</text><text x="838" y="84" class="kr" style="font-size:15px;fill:#d6fffa">기관 조회 + 온체인 issue</text>
    <path d="M1165 52 H1205" stroke="#7cbec0" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1230" width="330" height="105" rx="13" fill="#008f87"/><text x="1248" y="30" class="kr phase">P3 · 선택공개 제출</text><text x="1248" y="59" class="kr" style="font-size:16px;fill:#fff">목적별 payload · ECDSA 서명</text><text x="1248" y="84" class="kr" style="font-size:15px;fill:#d6fffa">60초 QR · 수령처 고정</text>
    <path d="M1575 52 H1615" stroke="#7cbec0" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1640" width="330" height="105" rx="13" fill="#008f87"/><text x="1658" y="30" class="kr phase">P4 · 검증/운영</text><text x="1658" y="59" class="kr" style="font-size:16px;fill:#fff">서명·대상·만료·철회 판정</text><text x="1658" y="84" class="kr" style="font-size:15px;fill:#d6fffa">사업자 스캔 · 관리자 revoke</text>
    <path d="M1985 52 H2025" stroke="#7cbec0" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="2050" width="330" height="105" rx="13" fill="#dd7f36"/><text x="2068" y="30" class="kr phase">P5 · 금융/생활 확장</text><text x="2068" y="59" class="kr" style="font-size:16px;fill:#fff">근태 → 급여 → 퇴직급여</text><text x="2068" y="84" class="kr" style="font-size:15px;fill:#fff1df">송금 · 적금 · 보험 · 정산</text>
    <path d="M2395 52 H2435" stroke="#7cbec0" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="2460" width="330" height="105" rx="13" fill="#dd7f36"/><text x="2478" y="30" class="kr phase">P6 · 검증/배포</text><text x="2478" y="59" class="kr" style="font-size:16px;fill:#fff">pytest E2E · access control</text><text x="2478" y="84" class="kr" style="font-size:15px;fill:#fff1df">시뮬레이터/테스트넷 · Render</text>
  </g>

  <!-- main swimlanes -->
  <rect x="90" y="440" width="505" height="1045" rx="20" fill="#fff" stroke="#b7ded8" stroke-width="3" filter="url(#shadow)"/>
  <rect x="635" y="440" width="1325" height="1045" rx="20" fill="#fff" stroke="#b8d0e5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="2000" y="440" width="910" height="1045" rx="20" fill="#fff" stroke="#efd0aa" stroke-width="3" filter="url(#shadow)"/>
