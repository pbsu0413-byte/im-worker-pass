  <rect x="1450" y="980" width="230" height="135" rx="12" fill="#f5f2ff" stroke="#b8a9e8"/><text x="1565" y="1013" text-anchor="middle" class="kr cardTitle">보험·알림</text><text x="1470" y="1045" class="kr txt">insurance submissions</text><text x="1470" y="1071" class="kr txt">체류 만료 120일 기준</text><text x="1470" y="1097" class="kr tiny">insurer.html 심사 큐</text>
  <rect x="1700" y="980" width="195" height="135" rx="12" fill="#eef7ff" stroke="#a6cceb"/><text x="1797" y="1013" text-anchor="middle" class="kr cardTitle">다국어</text><text x="1720" y="1045" class="kr txt">내장 사전</text><text x="1720" y="1071" class="kr txt">Gemini + cache</text><text x="1720" y="1097" class="kr tiny">POST /api/translate</text>
  <path d="M815 960 V930" stroke="#65797e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1065 960 V930" stroke="#65797e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1315 960 V930" stroke="#65797e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1565 960 V930" stroke="#65797e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1797 960 V930" stroke="#65797e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- decision branches -->
  <rect x="670" y="1195" width="610" height="250" rx="14" fill="#fff8ef" stroke="#f2c288" stroke-width="2"/><text x="700" y="1232" class="kr cardTitle">E. 체류자격별 금융 분기</text><text x="700" y="1265" class="kr txt">E-9 / H-2 → 출국만기보험 (상품 선택 없음)</text><text x="700" y="1293" class="kr txt">사업주 월 통상임금 8.3% 납입 · 출국 후 14일 이내</text><text x="700" y="1335" class="kr txt">E-7 등 → DC 퇴직연금</text><text x="700" y="1363" class="kr txt">운용상품 변경 · 변경 시점 잔액 동결</text><text x="700" y="1400" class="kr tiny">passport/{credential_id}가 두 경로를 통합해 반환</text>
  <rect x="1300" y="1195" width="625" height="250" rx="14" fill="#f7fafb" stroke="#c4d3d7" stroke-width="2"/><text x="1330" y="1232" class="kr cardTitle">F. 서버 상태와 개인정보 경계</text><text x="1330" y="1265" class="kr txt">_local_db · _presentation_sessions · _insurance_db</text><text x="1330" y="1293" class="kr txt">Supabase 연결 시 기관 원본 DB 대체</text><text x="1330" y="1326" class="kr txt">개인정보는 서버/앱 경계에서만 사용</text><text x="1330" y="1354" class="kr txt">체인에는 credential_id의 keccak256 해시 + 상태만</text><text x="1330" y="1388" class="kr tiny">발급기관별 원본 데이터는 서로 분리된 mock API로 표현</text>

