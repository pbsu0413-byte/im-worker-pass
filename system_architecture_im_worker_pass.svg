<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/><stop offset="1" stop-color="#eef7f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#123b46" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#58727a"/>
    </marker>
    <style>
      .kr{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill:#18343c}
      .title{font-size:44px;font-weight:800;letter-spacing:-1px}
      .sub{font-size:21px;fill:#557078}
      .lane{font-size:23px;font-weight:800;fill:#fff}
      .boxTitle{font-size:21px;font-weight:800}
      .boxText{font-size:16px;fill:#526970}
      .small{font-size:14px;fill:#62767c}
      .pill{font-size:15px;font-weight:700}
      .flow{font-size:18px;font-weight:700;fill:#254850}
      .muted{fill:#6f8389}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1780" cy="120" r="150" fill="#d9f3ef" opacity=".75"/>
  <circle cx="120" cy="1010" r="170" fill="#e4f6f5" opacity=".8"/>

  <text x="80" y="82" class="kr title">iM PASS · 외국인 근로자 신원·자격 지갑</text>
  <text x="82" y="120" class="kr sub">실명확인 → 기관별 자격 조회 → 서명된 선택공개 QR → 온체인 상태 검증 → 금융·근태 서비스</text>
  <rect x="1510" y="52" width="300" height="48" rx="24" fill="#06b9a5"/>
  <text x="1660" y="83" text-anchor="middle" class="kr" style="font-size:18px;font-weight:800;fill:#fff">SYSTEM ARCHITECTURE · v0.2</text>

  <!-- swimlane headers -->
  <rect x="80" y="160" width="370" height="48" rx="12" fill="#00a995"/>
  <text x="265" y="192" text-anchor="middle" class="kr lane">사용자 화면 / 채널</text>
  <rect x="480" y="160" width="800" height="48" rx="12" fill="#2776a6"/>
  <text x="880" y="192" text-anchor="middle" class="kr lane">FastAPI 애플리케이션 계층</text>
  <rect x="1310" y="160" width="530" height="48" rx="12" fill="#e48338"/>
  <text x="1575" y="192" text-anchor="middle" class="kr lane">데이터 · 외부 시스템</text>

  <!-- user channel column -->
  <rect x="80" y="230" width="370" height="690" rx="18" fill="#ffffff" stroke="#b9dedb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="105" y="260" width="320" height="150" rx="16" fill="#e9fbf7" stroke="#8bd9ce" stroke-width="2"/>
  <text x="130" y="298" class="kr boxTitle">① iM PASS 근로자</text>
  <text x="130" y="330" class="kr boxText">wallet · people · submit</text>
  <text x="130" y="357" class="kr boxText">근태 · 퇴직급여 · 송금 · 적금 · 보험</text>
  <rect x="105" y="440" width="320" height="120" rx="16" fill="#eef7ff" stroke="#9cc8ee" stroke-width="2"/>
  <text x="130" y="478" class="kr boxTitle">② iM PASS 사업자</text>
  <text x="130" y="510" class="kr boxText">scan · attendance</text>
  <text x="130" y="536" class="kr boxText">자격 검증 · 출퇴근 스캔 · 현장 집계</text>
  <rect x="105" y="590" width="320" height="150" rx="16" fill="#fff5e9" stroke="#f3c58b" stroke-width="2"/>
  <text x="130" y="628" class="kr boxTitle">③ iM PASS 은행·기관</text>
  <text x="130" y="660" class="kr boxText">wallet 발급 · admin · insurer</text>
  <text x="130" y="686" class="kr boxText">철회/복구 · 보험 심사 · 영업 대시보드</text>
  <text x="105" y="805" class="kr small">정적 HTML/CSS/JS · 7개 언어 i18n</text>
  <text x="105" y="832" class="kr small">FastAPI가 frontend 정적 파일까지 동일 프로세스로 서빙</text>

  <!-- app layer -->
  <rect x="480" y="230" width="800" height="690" rx="18" fill="#ffffff" stroke="#b5cfe3" stroke-width="2" filter="url(#shadow)"/>
  <rect x="510" y="260" width="740" height="78" rx="14" fill="#e9f3fb" stroke="#9cc8ee"/>
  <text x="535" y="296" class="kr boxTitle">API Gateway · FastAPI / Uvicorn</text>
  <text x="535" y="322" class="kr boxText">/wallet · /credentials · /presentations · /verify · /attendance · /passport · /insurance · /api/translate</text>

  <rect x="510" y="365" width="230" height="145" rx="14" fill="#f2fbfa" stroke="#80cfc4"/>
  <text x="625" y="399" text-anchor="middle" class="kr boxTitle">신원·지갑</text>
  <text x="530" y="430" class="kr boxText">wallet.py</text>
  <text x="530" y="456" class="kr boxText">bank KYC · 단말 키 등록</text>
  <text x="530" y="482" class="kr boxText">ECDSA P-256 서명 검증</text>

  <rect x="760" y="365" width="230" height="145" rx="14" fill="#f2f8ff" stroke="#9cc8ee"/>
  <text x="875" y="399" text-anchor="middle" class="kr boxTitle">자격·제출 검증</text>
  <text x="780" y="430" class="kr boxText">agency_api.py</text>
  <text x="780" y="456" class="kr boxText">8개 기관 목적별 조회</text>
  <text x="780" y="482" class="kr boxText">60초 QR · target/signature</text>

  <rect x="1010" y="365" width="240" height="145" rx="14" fill="#fff8ef" stroke="#f3c58b"/>
  <text x="1130" y="399" text-anchor="middle" class="kr boxTitle">서비스 도메인</text>
  <text x="1030" y="430" class="kr boxText">attendance · payroll</text>
  <text x="1030" y="456" class="kr boxText">departure · pension</text>
  <text x="1030" y="482" class="kr boxText">products · savings · settlement</text>

  <rect x="510" y="540" width="355" height="155" rx="14" fill="#fff8ef" stroke="#f3c58b"/>
  <text x="535" y="576" class="kr boxTitle">금융 패스포트</text>
  <text x="535" y="607" class="kr boxText">근태 → 예상 급여 → 퇴직급여</text>
  <text x="535" y="633" class="kr boxText">E-9/H-2 출국만기보험 · E-7 DC 연금</text>
  <text x="535" y="659" class="kr boxText">환율 보장 견적 · 귀국 목표 적금 · 정산</text>

  <rect x="885" y="540" width="365" height="155" rx="14" fill="#f5f2ff" stroke="#b8a9e8"/>
  <text x="910" y="576" class="kr boxTitle">보험·다국어·알림</text>
  <text x="910" y="607" class="kr boxText">보험 접수/심사 · 체류 만료 알림</text>
  <text x="910" y="633" class="kr boxText">내장 사전 + Gemini 번역 캐시</text>
  <text x="910" y="659" class="kr boxText">data-no-translate로 개인정보 보호</text>

  <rect x="510" y="730" width="740" height="145" rx="14" fill="#f7fafb" stroke="#c4d3d7"/>
  <text x="535" y="766" class="kr boxTitle">보안·상태 규칙</text>
  <rect x="535" y="790" width="150" height="34" rx="17" fill="#dff6f1"/><text x="610" y="813" text-anchor="middle" class="kr pill" style="fill:#087e70">SIGNATURE_INVALID</text>
  <rect x="700" y="790" width="150" height="34" rx="17" fill="#e6f0ff"/><text x="775" y="813" text-anchor="middle" class="kr pill" style="fill:#2c6597">TARGET_MISMATCH</text>
  <rect x="865" y="790" width="108" height="34" rx="17" fill="#fff0df"/><text x="919" y="813" text-anchor="middle" class="kr pill" style="fill:#aa5b16">REVOKED</text>
  <rect x="988" y="790" width="108" height="34" rx="17" fill="#f4eafa"/><text x="1042" y="813" text-anchor="middle" class="kr pill" style="fill:#77509f">EXPIRED</text>
  <text x="1110" y="813" class="kr small">온체인 상태 조회 후 최종 판정</text>

  <!-- external/data -->
  <rect x="1310" y="230" width="530" height="690" rx="18" fill="#ffffff" stroke="#efd0aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1340" y="260" width="470" height="130" rx="14" fill="#fff8ef" stroke="#f3c58b"/>
  <text x="1365" y="298" class="kr boxTitle">발급기관 원천 데이터 (Mock/Real)</text>
  <text x="1365" y="329" class="kr boxText">출입국 · 고용센터 · iM뱅크 KYC</text>
  <text x="1365" y="355" class="kr boxText">의료기관 · HRD Korea · Q-Net · KOSHA · NIIED</text>
  <text x="1365" y="379" class="kr small">목적별 최소 조회 · 민감정보는 원문 대신 상태/유효기간만</text>

  <rect x="1340" y="420" width="220" height="180" rx="14" fill="#f3fbfa" stroke="#80cfc4"/>
  <text x="1450" y="458" text-anchor="middle" class="kr boxTitle">저장소</text>
  <text x="1360" y="490" class="kr boxText">로컬 인메모리 DB</text>
  <text x="1360" y="516" class="kr boxText">Supabase 선택 연동</text>
  <text x="1360" y="542" class="kr boxText">seeds/*.json</text>
  <text x="1360" y="568" class="kr boxText">번역 캐시</text>

  <rect x="1590" y="420" width="220" height="180" rx="14" fill="#eef5ff" stroke="#9cc8ee"/>
  <text x="1700" y="458" text-anchor="middle" class="kr boxTitle">블록체인 계층</text>
  <text x="1610" y="490" class="kr boxText">blockchain_client.py</text>
  <text x="1610" y="516" class="kr boxText">keccak256 credential_id</text>
  <text x="1610" y="542" class="kr boxText">Valid / Revoked / None</text>
  <text x="1610" y="568" class="kr boxText">시뮬레이터 ↔ 테스트넷</text>

  <rect x="1340" y="635" width="470" height="240" rx="14" fill="#f8fafb" stroke="#c4d3d7"/>
  <text x="1365" y="674" class="kr boxTitle">CredentialRegistry.sol</text>
  <text x="1365" y="706" class="kr boxText">• 개인정보를 저장하지 않고 자격 ID 해시만 기록</text>
  <text x="1365" y="734" class="kr boxText">• issue() · revoke() · restore() · getStatus()</text>
  <text x="1365" y="762" class="kr boxText">• onlyOwner로 발급/철회 권한 통제</text>
  <text x="1365" y="790" class="kr boxText">• 이벤트: Issued / Revoked / Restored</text>
  <text x="1365" y="838" class="kr small">실제 RPC 설정이 없으면 결정론적 로컬 시뮬레이터로 구동</text>

  <!-- arrows -->
  <path d="M450 335 H510" stroke="#58727a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M450 500 H510" stroke="#58727a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M450 665 H510" stroke="#58727a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1250 325 H1340" stroke="#58727a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1250 470 H1590" stroke="#58727a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1250 615 H1340" stroke="#58727a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1450 600 V635" stroke="#58727a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1700 600 V635" stroke="#58727a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- flow strip -->
  <rect x="80" y="950" width="1760" height="78" rx="18" fill="#163f48"/>
  <text x="110" y="980" class="kr flow" style="fill:#9fe8de">DEMO FLOW</text>
  <text x="305" y="980" class="kr flow" style="fill:#fff">1 실명확인</text><text x="440" y="980" class="kr flow" style="fill:#7ccbd1">→</text>
  <text x="480" y="980" class="kr flow" style="fill:#fff">2 단말 키 등록</text><text x="665" y="980" class="kr flow" style="fill:#7ccbd1">→</text>
  <text x="705" y="980" class="kr flow" style="fill:#fff">3 기관 8곳 조회·발급</text><text x="950" y="980" class="kr flow" style="fill:#7ccbd1">→</text>
  <text x="990" y="980" class="kr flow" style="fill:#fff">4 선택공개 QR 제출</text><text x="1215" y="980" class="kr flow" style="fill:#7ccbd1">→</text>
  <text x="1255" y="980" class="kr flow" style="fill:#fff">5 수령처·온체인 검증</text><text x="1500" y="980" class="kr flow" style="fill:#7ccbd1">→</text>
  <text x="1540" y="980" class="kr flow" style="fill:#fff">6 근태·금융 서비스</text>
  <text x="110" y="1010" class="kr small" style="fill:#b6ced1">실패 케이스: 서명 위변조 / 수령처 불일치 / 철회 / 60초 만료</text>
</svg>
